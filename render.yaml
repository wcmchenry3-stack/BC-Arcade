databases:
  # --- BC Arcade Postgres (DEV ONLY) ---
  # This is the dev database. Production does NOT use a Render database —
  # prod data lives in Supabase (see docs/RENDER.md). Nothing on a `main`
  # service may reference this block via fromDatabase;
  # test_render_yaml_prod_database_is_not_a_render_db enforces that.
  # NOTE: the live dev DB predates this blueprint (its real database/user
  # names differ), so do not apply this block expecting it to adopt that DB.
  - name: bc-arcade-db
    databaseName: bc_arcade
    user: bc_arcade_user
    region: oregon
    plan: basic_256mb
    version: "18"
    ipAllowList: []

services:
  # --- BC Arcade FastAPI backend (prod) ---
  - type: web
    name: bc-arcade-api
    runtime: python
    branch: main
    rootDir: backend
    # Render auto-deploys main once the commit's CI checks pass; post-deploy-scan.yml
    # then ZAP-scans it. (These services were created by hand, so set the same
    # trigger in the dashboard: Settings -> Build & Deploy -> After CI Checks Pass.)
    autoDeployTrigger: checksPass
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port $PORT --timeout-keep-alive 5 --limit-max-requests 10000
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ALLOWED_ORIGINS
        value: "https://games.buffingchi.com,https://games-api.buffingchi.com"
      # Tags Sentry events and is the only environment whose crash-free
      # number counts (#851).
      - key: ENVIRONMENT
        value: production
      # Supabase session pooler (*.pooler.supabase.com, port 5432 — never the
      # transaction pooler on 6543, never the Render dev DB). The URL carries
      # the DB password: dashboard secret only, never committed.
      - key: DATABASE_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
      # Prod-only values — never reuse dev's keypair, salts or token.
      - key: ENTITLEMENT_PRIVATE_KEY
        sync: false
      - key: ENTITLEMENT_PUBLIC_KEY
        sync: false
      - key: DAILY_WORD_SALT
        sync: false
      - key: DAILY_CHALLENGE_SALT
        sync: false
      - key: ADMIN_API_TOKEN
        sync: false

  # --- BC Arcade Expo Web static frontend (prod) ---
  - type: web
    name: bc-arcade-frontend
    runtime: static
    branch: main
    rootDir: frontend
    # Render auto-deploys main once the commit's CI checks pass; post-deploy-scan.yml
    # then ZAP-scans it. (These services were created by hand, so set the same
    # trigger in the dashboard: Settings -> Build & Deploy -> After CI Checks Pass.)
    autoDeployTrigger: checksPass
    buildCommand: npm ci && node scripts/fetch-render-env.js && node scripts/check-build-env.js && npx expo export --platform web
    staticPublishPath: dist
    envVars:
      # APP_ENV is read by check-build-env.js from process.env (not from the
      # .env file that fetch-render-env.js writes). Must be set here so the
      # isProduction guard in the script fires during the Render build.
      - key: APP_ENV
        value: production
      - key: EXPO_PUBLIC_API_URL
        value: "https://games-api.buffingchi.com"
      - key: EXPO_PUBLIC_SENTRY_DSN
        sync: false
      - key: SKIP_SKIA_DOWNLOAD
        value: "1"
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://games-api.buffingchi.com https://games.buffingchi.com; img-src 'self' data: blob:; font-src 'self' data:; frame-ancestors 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

  # --- Python FastAPI backend (dev environment) ---
  - type: web
    name: bc-arcade-api-dev
    runtime: python
    branch: dev
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # alembic runs before uvicorn on every boot so schema stays in sync with
    # models shipped on dev. It is idempotent — noop when already current.
    startCommand: alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port $PORT --timeout-keep-alive 5 --limit-max-requests 10000
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ALLOWED_ORIGINS
        value: "https://dev-games.buffingchi.com,https://dev-games-api.buffingchi.com"
      - key: ENVIRONMENT
        value: development
      # Render Postgres `bc-arcade-db` (dev only).
      - key: DATABASE_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: ENTITLEMENT_PRIVATE_KEY
        sync: false
      - key: ENTITLEMENT_PUBLIC_KEY
        sync: false
      - key: DAILY_WORD_SALT
        sync: false
      - key: DAILY_CHALLENGE_SALT
        sync: false
      - key: ADMIN_API_TOKEN
        sync: false

  # --- Expo Web static frontend (dev environment) ---
  - type: web
    name: bc-arcade-frontend-dev
    runtime: static
    branch: dev
    rootDir: frontend
    # fetch-render-env.js merges EXPO_PUBLIC_API_URL (and SENTRY_DSN if set)
    # into .env before Expo bakes them into the static bundle.
    buildCommand: npm ci && node scripts/fetch-render-env.js && node scripts/check-build-env.js && npx expo export --platform web
    staticPublishPath: dist
    envVars:
      # APP_ENV is read by check-build-env.js from process.env (not from the
      # .env file that fetch-render-env.js writes). Must be set here so the
      # isProduction guard in the script fires during the Render build.
      - key: APP_ENV
        value: staging
      - key: EXPO_PUBLIC_API_URL
        value: "https://dev-games-api.buffingchi.com"
      - key: EXPO_PUBLIC_SENTRY_DSN
        sync: false
      # react-native-skia's postinstall downloads native binaries for all platforms.
      # This build only targets Expo Web; native binaries are not needed and the
      # download fails transiently on CDN errors. Skip it unconditionally.
      - key: SKIP_SKIA_DOWNLOAD
        value: "1"
    headers:
      - path: /*
        name: Content-Security-Policy
        # 'unsafe-inline' for script/style is required by Expo Web's output format (inlined styles
        # and event handlers). This is an accepted exception pending upstream Expo fix.
        value: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://dev-games-api.buffingchi.com https://dev-games.buffingchi.com; img-src 'self' data: blob:; font-src 'self' data:; frame-ancestors 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
