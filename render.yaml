services:
  # --- BC Arcade FastAPI backend (prod) ---
  - type: web
    name: bc-arcade-api
    runtime: python
    branch: main
    rootDir: backend
    # Render auto-deploys main once the commit's CI checks pass; post-deploy-scan.yml
    # then ZAP-scans it. (These services were created by hand, so set the same
    # trigger in the dashboard: Settings -> Build & Deploy -> After CI Checks Pass.)
    autoDeployTrigger: checksPass
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port $PORT --timeout-keep-alive 5 --workers 1 --no-proxy-headers
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      # Optional (#3301): a redis:// or rediss:// URL shares rate-limit counters
      # across restarts and instances. Unset = in-memory. Set it in the dashboard
      # (it can hold a password); needed before ever running more than one worker.
      # - key: RATE_LIMIT_STORAGE_URL
      #   sync: false
      - key: ALLOWED_ORIGINS
        value: "https://games.buffingchi.com,https://games-api.buffingchi.com"
      # Tags Sentry events and is the only environment whose crash-free
      # number counts (#851).
      - key: ENVIRONMENT
        value: production
      # Client IP for per-IP rate limits: trust CF-Connecting-IP, else the
      # X-Forwarded-For entry Render's proxy appended (#2863, RENDER.md).
      - key: TRUSTED_PROXY_MODE
        value: cloudflare
      # Supabase session pooler (*.pooler.supabase.com, port 5432 — never the
      # transaction pooler on 6543, never the Render dev DB). The URL carries
      # the DB password: dashboard secret only, never committed. After the app-role
      # cut-over (#3302, RENDER.md) this is the DML-only `bc_app` role's URL.
      - key: DATABASE_URL
        sync: false
      # Optional (#3302): the privileged role Alembic migrates as. Unset, Alembic in
      # startCommand uses DATABASE_URL, as before. Same pooler rules as DATABASE_URL.
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
      # Prod-only values — never reuse dev's keypair, salts or token.
      - key: ENTITLEMENT_PRIVATE_KEY
        sync: false
      - key: ENTITLEMENT_PUBLIC_KEY
        sync: false
      - key: DAILY_WORD_SALT
        sync: false
      - key: DAILY_CHALLENGE_SALT
        sync: false
      # Optional operational tunables (#3110) — leave unset for the defaults; see
      # ARCHITECTURE.md §11.1 for the allowed range of each.
      # - key: ENTITLEMENT_TOKEN_TTL_HOURS   # 24
      # - key: STALE_GAME_AFTER_HOURS        # 24
      # - key: MAX_RESULT_BYTES              # 8192
      # - key: MAX_GAME_METADATA_BYTES      # 16384
      # - key: MAX_EVENT_DATA_BYTES          # 8192
      # - key: MAX_BUG_LOG_CONTEXT_BYTES     # 16384
      # - key: MAX_EVENTS_PER_GAME           # 5000
      # - key: MAX_EVENT_BYTES_PER_GAME      # 1048576
      # - key: MAX_EVENT_BYTES_PER_SESSION_DAY  # 16777216
      # - key: MAX_BUG_LOGS_PER_SESSION      # 500
      # - key: BUG_LOG_RETENTION_DAYS        # 90
      # - key: STREAK_LOOKBACK_DAYS          # 60
      # - key: APPLE_REPLAY_WINDOW_HOURS     # 48
      # - key: DB_PING_TIMEOUT_SECONDS       # 5.0
      # - key: DB_STATEMENT_TIMEOUT_SECONDS  # 5.0
      # - key: DB_COMMAND_TIMEOUT_SECONDS    # 10.0
      # - key: DB_POOL_TIMEOUT_SECONDS       # 10.0

  # --- BC Arcade Expo Web static frontend (prod) ---
  - type: web
    name: bc-arcade-frontend
    runtime: static
    branch: main
    rootDir: frontend
    # Render auto-deploys main once the commit's CI checks pass; post-deploy-scan.yml
    # then ZAP-scans it. (These services were created by hand, so set the same
    # trigger in the dashboard: Settings -> Build & Deploy -> After CI Checks Pass.)
    autoDeployTrigger: checksPass
    buildCommand: npm ci && node scripts/fetch-render-env.js && node scripts/check-build-env.js && npx expo export --platform web
    staticPublishPath: dist
    envVars:
      # APP_ENV is read by check-build-env.js from process.env (not from the
      # .env file that fetch-render-env.js writes). Must be set here so the
      # isProduction guard in the script fires during the Render build.
      - key: APP_ENV
        value: production
      - key: EXPO_PUBLIC_API_URL
        value: "https://games-api.buffingchi.com"
      - key: EXPO_PUBLIC_SENTRY_DSN
        sync: false
      - key: SKIP_SKIA_DOWNLOAD
        value: "1"
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://games-api.buffingchi.com https://games.buffingchi.com; img-src 'self' data: blob:; font-src 'self' data:; frame-ancestors 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains

  # --- Python FastAPI backend (dev environment) ---
  - type: web
    name: bc-arcade-api-dev
    runtime: python
    branch: dev
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # alembic runs before uvicorn on every boot so schema stays in sync with
    # models shipped on dev. It is idempotent — noop when already current.
    startCommand: alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port $PORT --timeout-keep-alive 5 --workers 1 --no-proxy-headers
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      # Optional (#3301): a redis:// or rediss:// URL shares rate-limit counters
      # across restarts and instances. Unset = in-memory. Set it in the dashboard
      # (it can hold a password); needed before ever running more than one worker.
      # - key: RATE_LIMIT_STORAGE_URL
      #   sync: false
      - key: ALLOWED_ORIGINS
        value: "https://dev-games.buffingchi.com,https://dev-games-api.buffingchi.com"
      - key: ENVIRONMENT
        value: development
      # Client IP for per-IP rate limits: trust CF-Connecting-IP, else the
      # X-Forwarded-For entry Render's proxy appended (#2863, RENDER.md).
      - key: TRUSTED_PROXY_MODE
        value: cloudflare
      # The Supabase `dev` branch session pooler URL (dev only; RENDER.md).
      - key: DATABASE_URL
        sync: false
      # Optional (#3302): the privileged role Alembic migrates as; unset → DATABASE_URL.
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: ENTITLEMENT_PRIVATE_KEY
        sync: false
      - key: ENTITLEMENT_PUBLIC_KEY
        sync: false
      - key: DAILY_WORD_SALT
        sync: false
      - key: DAILY_CHALLENGE_SALT
        sync: false
      # Optional operational tunables (#3110) — leave unset for the defaults; see
      # ARCHITECTURE.md §11.1 for the allowed range of each.
      # - key: ENTITLEMENT_TOKEN_TTL_HOURS   # 24
      # - key: STALE_GAME_AFTER_HOURS        # 24
      # - key: MAX_RESULT_BYTES              # 8192
      # - key: MAX_GAME_METADATA_BYTES      # 16384
      # - key: MAX_EVENT_DATA_BYTES          # 8192
      # - key: MAX_BUG_LOG_CONTEXT_BYTES     # 16384
      # - key: MAX_EVENTS_PER_GAME           # 5000
      # - key: MAX_EVENT_BYTES_PER_GAME      # 1048576
      # - key: MAX_EVENT_BYTES_PER_SESSION_DAY  # 16777216
      # - key: MAX_BUG_LOGS_PER_SESSION      # 500
      # - key: BUG_LOG_RETENTION_DAYS        # 90
      # - key: STREAK_LOOKBACK_DAYS          # 60
      # - key: APPLE_REPLAY_WINDOW_HOURS     # 48
      # - key: DB_PING_TIMEOUT_SECONDS       # 5.0
      # - key: DB_STATEMENT_TIMEOUT_SECONDS  # 5.0
      # - key: DB_COMMAND_TIMEOUT_SECONDS    # 10.0
      # - key: DB_POOL_TIMEOUT_SECONDS       # 10.0

  # --- Expo Web static frontend (dev environment) ---
  - type: web
    name: bc-arcade-frontend-dev
    runtime: static
    branch: dev
    rootDir: frontend
    # fetch-render-env.js merges EXPO_PUBLIC_API_URL (and SENTRY_DSN if set)
    # into .env before Expo bakes them into the static bundle.
    buildCommand: npm ci && node scripts/fetch-render-env.js && node scripts/check-build-env.js && npx expo export --platform web
    staticPublishPath: dist
    envVars:
      # APP_ENV is read by check-build-env.js from process.env (not from the
      # .env file that fetch-render-env.js writes). Must be set here so the
      # isProduction guard in the script fires during the Render build.
      - key: APP_ENV
        value: staging
      - key: EXPO_PUBLIC_API_URL
        value: "https://dev-games-api.buffingchi.com"
      - key: EXPO_PUBLIC_SENTRY_DSN
        sync: false
      # react-native-skia's postinstall downloads native binaries for all platforms.
      # This build only targets Expo Web; native binaries are not needed and the
      # download fails transiently on CDN errors. Skip it unconditionally.
      - key: SKIP_SKIA_DOWNLOAD
        value: "1"
    headers:
      - path: /*
        name: Content-Security-Policy
        # 'unsafe-inline' for script/style is required by Expo Web's output format (inlined styles
        # and event handlers). This is an accepted exception pending upstream Expo fix.
        value: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://dev-games-api.buffingchi.com https://dev-games.buffingchi.com; img-src 'self' data: blob:; font-src 'self' data:; frame-ancestors 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
