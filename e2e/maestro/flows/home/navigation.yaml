appId: com.buffingchi.games
---
- runFlow: ../_shared/launch.yaml
# open-yacht.yaml answers Yacht's mode picker before checking the "Yacht"
# title; the picker's Android Modal window hides the title until then (#2373).
- runFlow:
    file: ../_shared/open-yacht.yaml
    env:
      yachtMode: "yacht-mode-solo"
- tapOn:
    id: "nav-back"
- extendedWaitUntil:
    visible:
      text: "BC Arcade"
    timeout: 8000
- takeScreenshot: navigation-home-return
