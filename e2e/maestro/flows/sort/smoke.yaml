appId: com.buffingchi.games
---
- runFlow: ../_shared/launch.yaml
- runFlow:
    file: ../_shared/navigate-to.yaml
    env:
      gameSlug: "sort"
      screenLabel: "Sort Puzzle"
# Level select only shows when no saved game is in progress; skip if resuming.
# `timeout` isn't a valid tapOn/selector field (see #2350) — `optional: true`
# alone is enough; Maestro's default ~7s find-timeout still applies.
- tapOn:
    id: "sort-level-1"
    optional: true
- extendedWaitUntil:
    visible:
      id: "sort-board"
    timeout: 8000
- tapOn:
    id: "sort-board"
- takeScreenshot: sort-smoke
