appId: com.buffingchi.games
---
- runFlow: ../_shared/launch.yaml
- runFlow:
    file: ../_shared/navigate-to.yaml
    env:
      gameSlug: "sudoku"
      screenLabel: "Sudoku"
# PreGame only shows when no puzzle is in progress; skip if resuming a saved puzzle.
# `timeout` isn't a valid tapOn/selector field (see #2350) — `optional: true`
# alone is enough; Maestro's default ~7s find-timeout still applies.
- tapOn:
    id: "sudoku-pregame-start"
    optional: true
- extendedWaitUntil:
    visible:
      id: "sudoku-digit-1"
    timeout: 8000
- tapOn:
    id: "sudoku-digit-1"
- takeScreenshot: sudoku-smoke
