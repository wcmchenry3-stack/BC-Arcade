appId: com.buffingchi.games
---
- runFlow: ../_shared/launch.yaml
- runFlow:
    file: ../_shared/navigate-to.yaml
    env:
      gameSlug: "freecell"
      screenLabel: "FreeCell"
- assertVisible:
    id: "freecell-board"
    timeout: 8000
# Confirm the top card of column 0 exists before swiping.
- assertVisible:
    id: "freecell-col-0-top"
    timeout: 3000
# Drag the top card of column 0 to freecell slot 0.
# At game start all 4 freecell slots are always empty and every column has cards,
# so this move is always valid — a reliable probe of the drag gesture path.
- swipe:
    from:
      id: "freecell-col-0-top"
    to:
      id: "freecell-slot-0"
    duration: 600
# Assert the card is now IN the slot — not just that the slot is visible.
# freecell-slot-0-card is the testID on the DraggableCard inside FreeCellSlot
# when the slot is occupied. This fails if the swipe was silently skipped.
- assertVisible:
    id: "freecell-slot-0-card"
    timeout: 3000
- takeScreenshot: freecell-drag
# Near-miss snap radius test: drag from column 1 top to a position offset from
# freecell slot 1, ~30% outside its bounds. The snap radius (default 0.35)
# should accept the drop even though the finger lands outside the exact bounds.
- assertVisible:
    id: "freecell-col-1-top"
    timeout: 3000
- swipe:
    from:
      id: "freecell-col-1-top"
    to:
      id: "freecell-slot-1"
    duration: 600
    offsetEnd:
      x: 30
      y: 20
# Assert the card landed in slot 1 despite the near-miss.
- assertVisible:
    id: "freecell-slot-1-card"
    timeout: 3000
- takeScreenshot: freecell-drag-snap-radius
