appId: com.buffingchi.games
---
# Subflow: everything between `launchApp` and a usable Home screen. Shared by
# launch.yaml (clean install, every flow's first step) and
# remove-leaderboard-name.yaml (relaunch keeping state), so both handle the
# CI emulator's ANR dialog and the dev-client launcher the same way.
#
# CI's emulator (pixel_6 profile, software-rendered `-gpu
# swiftshader_indirect`, see mobile-smoke-android.yml) occasionally ANRs
# Android's own home-screen launcher under the resource contention of a
# cold app install+launch right after launch.yaml's clearState — a system dialog,
# unrelated to our app, that becomes Maestro's foreground window and hides
# every assertion below it (even "BC Arcade"). Tapping "Wait" (never "Close
# app" — that's Android's launcher, not ours) is a no-op when it never
# appears; `while` re-checks in case it reappears more than once.
- repeat:
    while:
      visible: "Wait"
    commands:
      - tapOn: "Wait"
- extendedWaitUntil:
    visible:
      text: "BC Arcade"
    timeout: 15000
# expo-dev-launcher's launcher screen is compiled into every debug build and
# always shows first on a fresh install — embedding the JS bundle (CI-only,
# see docs/ANDROID-CI.md) does not skip it, it only makes this "Load
# embedded bundle" button appear so the real app can be reached without a
# Metro server. `optional: true` makes this a no-op outside CI (e.g. a local
# `npx expo run:android`/Xcode debug build with no embedded bundle, where the
# button never appears and the app never leaves this screen). See #2368.
- tapOn:
    text: "Load embedded bundle"
    optional: true
# "Choose a game" (common:app.subtitle) was removed from HomeScreen's rendered
# UI back in #356 — AppHeader only ever shows the title ("BC Arcade"), never a
# subtitle — but this assertion was never updated to match, since every flow
# has been stuck on the dev-client launcher (see above) until just now, so it
# never actually ran against the real app to catch the mismatch. `game-tile-
# yacht` is the testID convention _shared/navigate-to.yaml already uses to
# confirm a game tile — and therefore the real home screen grid, not just the
# "BC Arcade" header text the launcher screen shows too — has rendered.
- extendedWaitUntil:
    visible:
      id: "game-tile-yacht"
    timeout: 5000
