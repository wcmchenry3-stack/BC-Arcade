appId: com.buffingchi.games
---
# clearState: true — every flow starts from a clean install. Without it,
# state (and Solitaire/FreeCell's saved game) persists across flows in the
# same `maestro test` batch, since Maestro reuses one app install for the
# whole run. Several flows depend on a truly clean slot to be deterministic
# (e.g. solitaire/freecell drag.yaml's fixed-seed assertions only hold for
# the deal that happens once per install) — order-dependent flakiness from a
# warm state is worse than the extra launch cost. See #2346.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      text: "BC Arcade"
    timeout: 15000
# expo-dev-launcher's launcher screen is compiled into every debug build and
# always shows first on a fresh install — embedding the JS bundle (CI-only,
# see docs/ANDROID-CI.md) does not skip it, it only makes this "Load
# embedded bundle" button appear so the real app can be reached without a
# Metro server. `optional: true` makes this a no-op outside CI (e.g. a local
# `npx expo run:android`/Xcode debug build with no embedded bundle, where the
# button never appears and the app never leaves this screen). See #2368.
- tapOn:
    text: "Load embedded bundle"
    optional: true
- extendedWaitUntil:
    visible:
      text: "Choose a game"
    timeout: 5000
