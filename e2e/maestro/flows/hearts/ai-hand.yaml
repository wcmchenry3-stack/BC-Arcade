appId: com.buffingchi.games
---
- runFlow: ../_shared/launch.yaml
- runFlow:
    file: ../_shared/navigate-to.yaml
    env:
      gameSlug: "hearts"
      screenLabel: "Hearts"
# Difficulty picker appears only on first launch; skip if a saved game exists.
# `optional: true` alone is enough — see "Timeouts" in e2e/maestro/README.md.
- tapOn:
    id: "hearts-start-game"
    optional: true
# ── Pass phase (round 1 always passes left) ────────────────────────────────────
# PlayerHand sorts cards ♣♦♠♥ ascending rank.  Tapping positions 0, 4, and 8
# reliably lands on 3 different suits, so 3 distinct cards are selected
# regardless of the random deal.  Any 3 cards are valid to pass in Hearts.
#
# Maestro's `text` matches the ENTIRE node text (Java regex `.matches()`, not
# a substring search) — PassBanner.tsx's prompt is one Text node reading
# "Choose 3 cards to Pass left" (pass.instructions + pass.direction.left from
# en/hearts.json), never just "Pass left" alone, so the pattern needs the
# leading `.*`. Confirmed via CI: this crashed on every Hearts mount before
# #2372's accessibilityRole fix, so this literal-text mismatch was never
# exercised until that crash was fixed.
- extendedWaitUntil:
    visible:
      text: ".*Pass left"
    timeout: 8000
- tapOn:
    id: "hearts-hand-card-0"
- tapOn:
    id: "hearts-hand-card-4"
- tapOn:
    id: "hearts-hand-card-8"
# Confirm button enables once exactly 3 cards are selected.
- tapOn:
    text: "Confirm"
# ── Entering the trick phase ────────────────────────────────────────────────────
# "Choose 3 cards to Pass left" disappears once the engine processes all 4
# passes. Same `.*` requirement as above — otherwise this "not visible" check
# is vacuously true (a literal "Pass left" was never present to begin with).
- extendedWaitUntil:
    notVisible:
      text: ".*Pass left"
    timeout: 10000
# ── Trick 1 ─────────────────────────────────────────────────────────────────────
# The seat that holds 2♣ leads first. If an AI leads, the AI turn loop drives
# seats 1–3 automatically before the human's turn — but PlayerHand.tsx disables
# every hand card via RN's Pressable `disabled` prop whenever it isn't the
# human's turn (validCards === [] when currentPlayerIndex !== HUMAN), so a tap
# landing before the human's turn is a true no-op: the disabled Pressable never
# even calls onPress, never mind reaching HeartsScreen's own
# currentPlayerIndex===HUMAN guard in handleCardPress.
#
# A single blind tap (this flow's previous version) assumed the AI loop always
# finishes within Maestro's own step-execution latency — true on a fast
# device, but CI confirmed otherwise (this flow stalled here waiting for "Your
# hand, 12 cards" after only the leader's card appeared). A targeted Jest repro
# with fake timers (HeartsScreen.test.tsx's "#2372 CI investigation" describe
# block) confirmed the AI loop itself completes correctly every time — this
# was a flow-timing assumption, not an engine bug. `repeat: { while: ... }`
# retries the tap until the human's hand count actually changes, tolerating
# however many AI turns (0–3) run first regardless of CI emulator speed.
#
# A single fixed card position (this flow's previous version tapped position 4
# only, assuming the ♣♦♠♥ sort order always puts a legal card there) further
# assumed *some* index is always playable regardless of the deal — false:
# `getValidPlays` restricts taps to whichever suit was led (or any card once
# hearts break / on a void), and CI caught a deal where the human held a
# single club sorted to position 0 while North led clubs, leaving every other
# position permanently disabled all trick (run 33135950239). Rather than
# reimplement `getValidPlays` Maestro-side, each retry pass now sweeps every
# hand-card position in ascending order: a tap on a disabled card is a
# confirmed no-op (see above), so at most one tap per pass ever actually
# lands — whichever position holds the legal card — and the rest are inert.
- repeat:
    while:
      visible:
        text: "Your hand, 13 cards"
    commands:
      - tapOn:
          id: "hearts-hand-card-0"
      - tapOn:
          id: "hearts-hand-card-1"
      - tapOn:
          id: "hearts-hand-card-2"
      - tapOn:
          id: "hearts-hand-card-3"
      - tapOn:
          id: "hearts-hand-card-4"
      - tapOn:
          id: "hearts-hand-card-5"
      - tapOn:
          id: "hearts-hand-card-6"
      - tapOn:
          id: "hearts-hand-card-7"
      - tapOn:
          id: "hearts-hand-card-8"
      - tapOn:
          id: "hearts-hand-card-9"
      - tapOn:
          id: "hearts-hand-card-10"
      - tapOn:
          id: "hearts-hand-card-11"
      - tapOn:
          id: "hearts-hand-card-12"
# After the human plays and the AI loop completes all remaining seats, every
# player's hand shrinks by 1.  "Your hand, 12 cards" confirms trick 1 finished
# and the AI loop ran 3 turns without crashing.
- extendedWaitUntil:
    visible:
      text: "Your hand, 12 cards"
    timeout: 15000
# ── Trick 2 ─────────────────────────────────────────────────────────────────────
# Same retry-and-sweep rationale as trick 1 — whoever won trick 1 leads trick
# 2, which may again be an AI requiring 1–3 auto-played turns before the
# human's turn, and the legal card may be at any hand position. One fewer
# position than trick 1 since the hand is down to 12 cards.
- repeat:
    while:
      visible:
        text: "Your hand, 12 cards"
    commands:
      - tapOn:
          id: "hearts-hand-card-0"
      - tapOn:
          id: "hearts-hand-card-1"
      - tapOn:
          id: "hearts-hand-card-2"
      - tapOn:
          id: "hearts-hand-card-3"
      - tapOn:
          id: "hearts-hand-card-4"
      - tapOn:
          id: "hearts-hand-card-5"
      - tapOn:
          id: "hearts-hand-card-6"
      - tapOn:
          id: "hearts-hand-card-7"
      - tapOn:
          id: "hearts-hand-card-8"
      - tapOn:
          id: "hearts-hand-card-9"
      - tapOn:
          id: "hearts-hand-card-10"
      - tapOn:
          id: "hearts-hand-card-11"
- extendedWaitUntil:
    visible:
      text: "Your hand, 11 cards"
    timeout: 15000
# ── Trick 3 ─────────────────────────────────────────────────────────────────────
# Same retry-and-sweep rationale as trick 1, down to 11 cards.
- repeat:
    while:
      visible:
        text: "Your hand, 11 cards"
    commands:
      - tapOn:
          id: "hearts-hand-card-0"
      - tapOn:
          id: "hearts-hand-card-1"
      - tapOn:
          id: "hearts-hand-card-2"
      - tapOn:
          id: "hearts-hand-card-3"
      - tapOn:
          id: "hearts-hand-card-4"
      - tapOn:
          id: "hearts-hand-card-5"
      - tapOn:
          id: "hearts-hand-card-6"
      - tapOn:
          id: "hearts-hand-card-7"
      - tapOn:
          id: "hearts-hand-card-8"
      - tapOn:
          id: "hearts-hand-card-9"
      - tapOn:
          id: "hearts-hand-card-10"
- extendedWaitUntil:
    visible:
      text: "Your hand, 10 cards"
    timeout: 15000
# 3 full tricks completed: the AI turn loop ran ≥ 9 turns across 3 tricks
# without crashing, exercising all 3 AI personas (Cautious/Schemer/Daring).
- takeScreenshot: hearts-ai-hand
