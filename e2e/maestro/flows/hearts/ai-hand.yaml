appId: com.buffingchi.games
---
- runFlow: ../_shared/launch.yaml
- runFlow:
    file: ../_shared/navigate-to.yaml
    env:
      gameSlug: "hearts"
      screenLabel: "Hearts"
# No pre-game screen (#3489): Hearts deals the table itself, or resumes a saved game.
# ── Pass phase (round 1 always passes left) ────────────────────────────────────
# PlayerHand sorts cards ♣♦♠♥ ascending rank.  Tapping positions 0, 4, and 8
# reliably lands on 3 different suits, so 3 distinct cards are selected
# regardless of the random deal.  Any 3 cards are valid to pass in Hearts.
#
# Maestro's `text` matches the ENTIRE node text (Java regex `.matches()`, not
# a substring search) — PassBanner.tsx's prompt is one Text node reading
# "Choose 3 cards to Pass left" (pass.instructions + pass.direction.left from
# en/hearts.json), never just "Pass left" alone, so the pattern needs the
# leading `.*`. Confirmed via CI: this crashed on every Hearts mount before
# #2372's accessibilityRole fix, so this literal-text mismatch was never
# exercised until that crash was fixed.
- extendedWaitUntil:
    visible:
      text: ".*Pass left"
    timeout: 8000
- tapOn:
    id: "hearts-hand-card-0"
- tapOn:
    id: "hearts-hand-card-4"
- tapOn:
    id: "hearts-hand-card-8"
# Confirm button enables once exactly 3 cards are selected. Tapped by id, not
# text: the Pressable's accessibilityLabel ("Confirm — pass 3 selected cards")
# replaces its child Text on iOS, so no "Confirm" text node exists there.
- tapOn:
    id: "hearts-pass-confirm"
# ── Entering the trick phase ────────────────────────────────────────────────────
# "Choose 3 cards to Pass left" disappears once the engine processes all 4
# passes. Same `.*` requirement as above — otherwise this "not visible" check
# is vacuously true (a literal "Pass left" was never present to begin with).
- extendedWaitUntil:
    notVisible:
      text: ".*Pass left"
    timeout: 10000
# `repeat: while:` (below) checks its condition exactly once with no settle
# wait, unlike extendedWaitUntil — confirmed via the run's commands-*.json,
# which reported the repeat as SKIPPED (0 iterations) rather than merely
# slow. Tricks 2 and 3 get this settling for free because their repeat
# blocks are entered right after the *previous* trick's own
# extendedWaitUntil already confirmed the hand's new count is visible; trick
# 1 has no such predecessor — only the negative "Pass left gone" assertion
# above, which races PlayerHand's post-pass re-render (back to 13 cards
# before trick 1's lead even plays). CI caught the loss: the repeat was
# skipped, the human's card was never tapped, and the hand sat at 13 cards
# with 8♣/K♣ legally enabled for the rest of the flow's timeout (run
# 33229384311). This explicit wait removes the race the same way the
# trick 2/3 boundaries already get implicitly.
#
# Hand size is read from card testIDs, not the "Your hand, N cards" label
# (run 41582095051: never visible). PlayerHand renders that label as a 1x1,
# opacity-0 srOnly Text, which Maestro does not count as visible. Each card
# is `hearts-hand-card-<i>` (0-based, sorted), so N cards <=> card N-1 exists
# and card N doesn't. On the pixel_6 the 13-card hand fans across the screen
# (PlayerHand, game/hearts/layout.ts: at least 24 dp of each card shows), so every
# card is on screen.
- extendedWaitUntil:
    visible:
      id: "hearts-hand-card-12"
    timeout: 5000
# ── Trick 1 ─────────────────────────────────────────────────────────────────────
# The seat that holds 2♣ leads first. If an AI leads, the AI turn loop drives
# seats 1–3 automatically before the human's turn — but PlayerHand.tsx disables
# every hand card via RN's Pressable `disabled` prop whenever it isn't the
# human's turn (validCards === [] when currentPlayerIndex !== HUMAN), so a tap
# landing before the human's turn is a true no-op: the disabled Pressable never
# even calls onPress, never mind reaching HeartsScreen's own
# currentPlayerIndex===HUMAN guard in handleCardPress.
#
# A single blind tap (an earlier version of this flow) assumed the AI loop
# always finishes within Maestro's own step-execution latency — true on a
# fast device, but CI confirmed otherwise (this flow stalled here waiting for
# "Your hand, 12 cards" after only the leader's card appeared). A targeted
# Jest repro with fake timers (HeartsScreen.test.tsx's "#2372 CI
# investigation" describe block) confirmed the AI loop itself completes
# correctly every time — this was a flow-timing assumption, not an engine
# bug. `repeat: { while: ... }` retries the tap until the human's hand count
# actually changes, tolerating however many AI turns (0–3) run first
# regardless of CI emulator speed. `times: 20` bounds each loop (#2400): a
# stall fails at the next extendedWaitUntil instead of burning the job. Each
# pass is one optional tap, so 20 passes comfortably cover 0-3 AI turns.
#
# A single fixed card position (a later version tapped position 4 only,
# assuming the ♣♦♠♥ sort order always puts a legal card there) further
# assumed *some* index is always playable regardless of the deal — false:
# `getValidPlays` restricts taps to whichever suit was led (or any card once
# hearts break / on a void, or — trick 1 specifically — no points allowed
# even on a void), and CI caught a deal where the human held a single club
# sorted to position 0 while North led clubs, leaving every other position
# permanently disabled all trick (run 33135950239).
#
# Sweeping every position with 12–13 separate `tapOn` commands per retry pass
# (a still-later version) was also tried and is also wrong: each `tapOn` on a
# disabled card is a no-op but still pays Maestro's own no-change retry cost
# before moving to the next command, so a full sweep can easily out-last the
# AI's turn — CI still timed out, now stuck re-running an ever-slower sweep
# instead of a single fast tap (run 33226744377). The actual fix is Maestro's
# `enabled` state selector (available since CLI 1.23.0, well under our
# 1.39.13 pin): combined with `id` (itself regex-matched, same as
# navigate-to.yaml's `id: "game-tile-${gameSlug}"`) and `index: 0`, one
# `tapOn` finds whichever hand-card position is currently enabled — there's
# ever at most one candidate set per turn, and `index: 0` picks the lowest
# position in it. `optional: true` is required here because during an AI's
# turn *nothing* matches (every card disabled) — without it, that no-match
# would be a hard flow failure instead of just an empty, harmless pass.
# (`idRegex` — this flow's first attempt at this selector — is not a
# recognized YAML field at our pinned CLI version and fails to parse at all;
# run 33228252817. `id` is the correct field; it's regex-matched already.)
#
# UPDATE (#2400, run 41586461179): `enabled: true` on `hearts-hand-card-.*`
# never filtered anything. That testID is on AnimatedCardSlot's wrapper View,
# which Maestro always reports as enabled; the disabled state lives on the
# PlayingCard Pressable inside it. So index 0 was always card 0, legal or not,
# and trick 3 stalled on "Nothing changed in the UI" taps. PlayerHand now puts
# `hearts-hand-playable-<i>` on the Pressable of each legal card only, so this
# taps the first legal card; nothing matches during an AI's turn.
- repeat:
    times: 20
    while:
      visible:
        id: "hearts-hand-card-12"
    commands:
      - tapOn:
          id: "hearts-hand-playable-.*"
          index: 0
          optional: true
# After the human plays and the AI loop completes all remaining seats, every
# player's hand shrinks by 1.  12 cards (card 12 gone) confirms trick 1
# finished and the AI loop ran 3 turns without crashing.
- extendedWaitUntil:
    notVisible:
      id: "hearts-hand-card-12"
    timeout: 15000
# ── Trick 2 ─────────────────────────────────────────────────────────────────────
# Same rationale as trick 1 — whoever won trick 1 leads trick 2, which may
# again be an AI requiring 1–3 auto-played turns before the human's turn, and
# the legal card may be at any hand position (no first-trick point
# restriction from here on, so more of the hand may be enabled at once —
# `index: 0` still picks a single, valid card deterministically).
- repeat:
    times: 20
    while:
      visible:
        id: "hearts-hand-card-11"
    commands:
      - tapOn:
          id: "hearts-hand-playable-.*"
          index: 0
          optional: true
- extendedWaitUntil:
    notVisible:
      id: "hearts-hand-card-11"
    timeout: 15000
# ── Trick 3 ─────────────────────────────────────────────────────────────────────
# Same rationale as trick 1.
- repeat:
    times: 20
    while:
      visible:
        id: "hearts-hand-card-10"
    commands:
      - tapOn:
          id: "hearts-hand-playable-.*"
          index: 0
          optional: true
- extendedWaitUntil:
    notVisible:
      id: "hearts-hand-card-10"
    timeout: 15000
# 3 full tricks completed: the AI turn loop ran ≥ 9 turns across 3 tricks
# without crashing, exercising the Conservative CPU.
- takeScreenshot: hearts-ai-hand
