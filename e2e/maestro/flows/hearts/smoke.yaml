appId: com.buffingchi.games
---
- runFlow: ../_shared/launch.yaml
- runFlow:
    file: ../_shared/navigate-to.yaml
    env:
      gameSlug: "hearts"
      screenLabel: "Hearts"
# No pre-game screen (#3489): Hearts deals the table itself, or resumes a saved game.
- extendedWaitUntil:
    visible:
      id: "hearts-player-hand-area"
    timeout: 10000
- tapOn:
    id: "hearts-player-hand-area"
- takeScreenshot: hearts-smoke
