appId: com.buffingchi.games
# Cascade demo flow (#3705): play until the stack overflows and the result
# card shows. Tagged `demo`, so only the `flows: cascade-demo` dispatch runs it
# (see demo-open.yaml).
#
# By play, not by test hook: `__cascade_triggerGameOver` lives on the app's
# JS globalThis, and Maestro has no way to call it (its runScript/evalScript
# run in Maestro's own JS engine on the host, not in the app). Every drop
# lands in the middle until a piece stays above the overflow line for 3 s
# (OVERFLOW_TICKS_THRESHOLD) and the game ends. That takes tens of drops, so
# this is the slowest demo (a few minutes on Android, more on iOS). `times`
# bounds the loop; a run that never overflows fails at the wait below.
#
# Android's screen recorder stops at 3 minutes, so a long run's video can end
# before the result card. The final screenshot always shows it.
tags:
  - demo
---
- runFlow: ../_shared/launch.yaml
- startRecording: cascade-demo-loss
- runFlow: ../_shared/open-cascade.yaml
- repeat:
    times: 150
    while:
      notVisible:
        id: "cascade-result-title"
    commands:
      # optional: the game can end between the check above and this tap, and
      # the result card then covers the board.
      - tapOn:
          id: "cascade-game-area"
          retryTapIfNoChange: false
          optional: true
- extendedWaitUntil:
    visible:
      id: "cascade-result-title"
    timeout: 15000
- takeScreenshot: cascade-demo-loss
- stopRecording
