appId: com.buffingchi.games
# Cascade demo flow (#3699): the win, its celebration and the win card. Tagged `demo`, so only
# the `flows: cascade-demo` dispatch runs it (see demo-open.yaml).
#
# `cascade-test-win` (test-build-only, see demo-loss.yaml) restores two tier-10 pieces about to
# merge: within about 0.2 s they make the capstone (Pumpkin / Milky Way), which is the win. The
# celebration plays for about 2.1 s (the pile dims, the capstone rises to the centre with its
# glow, gold ring and cheering face), then the result card (`cascade-result-title`, "You Win!").
# The video shows all of it; the screenshot is taken once the card is up. The tap does not wait
# for the screen to settle (the celebration keeps it moving), so the flow stays short.
tags:
  - demo
---
- runFlow: ../_shared/launch.yaml
- startRecording: cascade-demo-win
- runFlow: ../_shared/open-cascade.yaml
- takeScreenshot: cascade-demo-win-before
- tapOn:
    id: "cascade-test-win"
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible:
      id: "cascade-result-title"
    timeout: 15000
- assertVisible:
    id: "cascade-result-title"
    text: "You Win!"
- takeScreenshot: cascade-demo-win-result
- stopRecording
