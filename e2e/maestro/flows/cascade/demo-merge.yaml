appId: com.buffingchi.games
# Cascade demo flow (#3705): drop until two pieces merge. Tagged `demo`, so
# only the `flows: cascade-demo` dispatch runs it (see demo-open.yaml).
#
# Points come only from merges, so a score above 0 means a merge happened.
# The score Text has testID `cascade-score` (ScoreDisplay.tsx). The queue is
# random (Maestro cannot reach `__cascade_setSeed`, see demo-drop.yaml), but
# the first tiers are small and every drop lands in the middle, so a merge
# comes within a few drops. `times` bounds the loop.
tags:
  - demo
---
- runFlow: ../_shared/launch.yaml
- startRecording: cascade-demo-merge
- runFlow: ../_shared/open-cascade.yaml
- takeScreenshot: cascade-demo-merge-before
- repeat:
    times: 20
    while:
      notVisible:
        id: "cascade-score"
        text: "[1-9].*"
    commands:
      - tapOn:
          id: "cascade-game-area"
          retryTapIfNoChange: false
      - waitForAnimationToEnd:
          timeout: 1000
- extendedWaitUntil:
    visible:
      id: "cascade-score"
      text: "[1-9].*"
    timeout: 10000
- takeScreenshot: cascade-demo-merge-after
- stopRecording
