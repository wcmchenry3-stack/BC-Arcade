appId: com.buffingchi.games
---
- runFlow: ../_shared/launch.yaml
- runFlow:
    file: ../_shared/navigate-to.yaml
    env:
      gameSlug: "yacht"
      screenLabel: "Yacht"
# Start a VS Computer game (default difficulty — fastest AI turns).
# The mode picker is optional; skip if a saved VS game is already in progress.
- tapOn:
    text: "VS Computer"
    optional: true
    timeout: 3000
- assertVisible:
    id: "yacht-roll-button"
    timeout: 8000
# Roll once so the scorecard rows become selectable.
- tapOn:
    id: "yacht-roll-button"
- assertVisible:
    text: "Tap dice to hold"
    timeout: 5000
# Score Ones (always visible in the default upper tab; may score 0 but is always legal).
# This triggers setIsAiTurn(true) and the AI autonomous turn loop begins.
- tapOn:
    id: "score-row-ones"
    timeout: 3000
# Assert the AI's autonomous turn is running, then that it completes.
- assertVisible:
    text: "Computer's Turn"
    timeout: 10000
- assertVisible:
    text: "Your Turn"
    timeout: 15000
- takeScreenshot: yacht-ai-turn
