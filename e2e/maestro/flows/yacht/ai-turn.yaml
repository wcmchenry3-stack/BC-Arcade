appId: com.buffingchi.games
---
- runFlow: ../_shared/launch.yaml
# Fresh install, so the "Choose Mode" picker always opens. open-yacht.yaml
# taps the mode button before checking the "Yacht" title, which the
# picker's Android Modal window hides until it closes (#2373).
# `yacht-mode-vs`, not text "VS Computer": that text is also the
# picker's subtitle, so a text tap could land on the subtitle. The VS
# difficulty is whatever the picker opens on (Medium on a fresh install).
- runFlow:
    file: ../_shared/open-yacht.yaml
    env:
      yachtMode: "yacht-mode-vs"
- extendedWaitUntil:
    visible:
      id: "yacht-roll-button"
    timeout: 8000
# Roll once so the scorecard rows become selectable.
- tapOn:
    id: "yacht-roll-button"
- extendedWaitUntil:
    visible:
      text: "Tap dice to hold"
    timeout: 5000
# Score Ones (every row is on screen at once, no tabs; may score 0 but is always legal).
# This triggers setIsAiTurn(true) and the AI autonomous turn loop begins.
- tapOn:
    id: "score-row-ones"
# Assert the AI's autonomous turn is running, then that it completes.
- extendedWaitUntil:
    visible:
      text: "Computer's Turn"
    timeout: 10000
- extendedWaitUntil:
    visible:
      text: "Your Turn"
    timeout: 15000
- takeScreenshot: yacht-ai-turn
