appId: com.buffingchi.games
---
- runFlow: ../_shared/launch.yaml
# Fresh install, so the "Choose Mode" picker always opens. open-yacht.yaml
# taps the mode button before checking the "Yacht" title, which the
# picker's Android Modal window hides until it closes (#2373).
- runFlow:
    file: ../_shared/open-yacht.yaml
    env:
      yachtMode: "yacht-mode-solo"
- extendedWaitUntil:
    visible:
      id: "yacht-roll-button"
    timeout: 8000
- tapOn:
    id: "yacht-roll-button"
# "Tap dice to hold" only appears after the first roll — proves the roll fired.
- extendedWaitUntil:
    visible:
      text: "Tap dice to hold"
    timeout: 5000
- takeScreenshot: yacht-smoke
