appId: com.buffingchi.games
# Mahjong demo flow (#3801): the Turtle board, then a double-tap zoom, to show
# how crisp the tiles are zoomed in. Tagged `demo`, so only the
# `flows: mahjong-demo` dispatch runs it (see demo-open.yaml).
#
# The board's camera zooms on a double-tap (Gesture.Tap().numberOfTaps(2) in
# game/mahjong/useBoardZoomPan.ts): from the fitted view it zooms to readable
# tiles centred on the tap. On a 390x844 phone Turtle fits at about 25.6 px a
# tile, so it does not open zoomed and the double-tap zooms in. (If a device
# opened it already zoomed in, the double-tap would zoom out: zoomAt toggles.
# Compare the shot with mahjong-demo-open, see docs/MAESTRO.md.) `doubleTapOn`
# with the viewport's testID taps the centre of the board, which Maestro
# resolves the same way on both platforms. A tile under the tap also gets
# selected (the second tap of a double-tap keeps it selected), so the zoomed
# frame may show one selected tile.
tags:
  - demo
---
- runFlow: ../_shared/launch.yaml
- startRecording: mahjong-demo-zoom
- runFlow: ../_shared/open-mahjong.yaml
- waitForAnimationToEnd:
    timeout: 3000
- doubleTapOn:
    id: "mahjong-board-viewport"
# The camera eases in over a few hundred ms (instant under Reduce Motion).
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: mahjong-demo-zoom
- stopRecording
