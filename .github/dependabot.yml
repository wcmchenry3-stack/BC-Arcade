version: 2
updates:
  # Frontend (npm)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Narrow groups first — Dependabot assigns a dependency to the first
      # group it matches, so these keep their identity instead of being
      # swallowed by the catch-all below.
      expo:
        patterns: ["expo*", "@expo/*"]
      react-navigation:
        patterns: ["@react-navigation/*"]
      react-ecosystem:
        patterns: ["react", "react-dom", "react-test-renderer", "@types/react", "react-native"]
      # CVE fixes get their own PR so they are never held up behind a routine batch.
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
      # Everything else minor/patch arrives as one PR per week instead of ~10.
      # Majors are deliberately excluded and still come individually.
      minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Expo SDK and React Native upgrades need native module compatibility
      # testing and coordinated migration across the whole family, so they are
      # done deliberately on a dedicated branch with `npx expo install --fix`
      # rather than arriving as individual PRs.
      #
      # BookshelfAI learned this the harder way: it ignored only "expo", so the
      # other expo-* packages kept opening separate major PRs and fragmented the
      # SDK 56 -> 57 upgrade across four of them.
      - dependency-name: "expo*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "@expo/*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "babel-preset-expo"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "jest-expo"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "eslint-config-expo"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "react-native"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      # @react-native/* packages (e.g. jest-preset) are versioned in lockstep
      # with react-native itself — #2316 bumped jest-preset to 0.87.0 while
      # react-native stayed pinned at 0.86.2 and broke jest's module
      # resolution for every test suite. Move it only alongside react-native.
      - dependency-name: "@react-native/*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      # react-native-worklets and react-native-reanimated are versioned
      # against each other AND against the expo-modules-core release that
      # ships their native worklets bridging code. #2358 bumped worklets to
      # 0.12.1 (dragging reanimated to 4.6.0 via its peer dep) while
      # expo-modules-core stayed on Expo SDK 57's 57.0.12 — the latest SDK 57
      # has published — and broke the Android C++ build: expo-modules-core's
      # WorkletJSCallInvoker.cpp calls WorkletRuntime::executeSync, which
      # worklets 0.12.x removed. Move these only once a compatible
      # expo-modules-core ships (Expo SDK 58+), alongside the SDK bump.
      - dependency-name: "react-native-worklets"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "react-native-reanimated"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

      # eslint 10 removed the legacy context.getFilename() API that
      # eslint-plugin-react still calls (latest stable 7.37.5 peers eslint
      # <=9; only a 7.8.0-rc exists), so `eslint .` crashes with "Error while
      # loading rule 'react/display-name'" — see #3379, closed for this reason.
      # Revisit once eslint-plugin-react ships a stable release that supports
      # eslint 10, then remove this ignore rule.
      - dependency-name: "eslint"
        update-types:
          - "version-update:semver-major"

  # Backend (pip)
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
      minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # pydantic_core is pinned exactly to what the installed pydantic version
      # requires (see the comment in backend/requirements.txt). pydantic pins
      # pydantic_core to an exact version, so bumping pydantic_core alone
      # always breaks pip's resolver — see #2323, closed for this reason.
      # Bump pydantic and pydantic_core together manually once a compatible
      # pydantic release ships, then remove this ignore rule.
      - dependency-name: "pydantic_core"
      # asn1 is pinned exactly by app-store-server-library (3.1.2 requires
      # asn1==3.2.0), so bumping asn1 alone makes pip's resolver fail with
      # ResolutionImpossible — it broke every Python check on #3381. Bump
      # asn1 together with app-store-server-library once a release relaxes
      # the pin, then remove this ignore rule.
      - dependency-name: "asn1"
      # redis is only the optional backing store for the rate limiter, reached
      # through `limits`, whose redis extra caps it at <8.0.0 (limits 5.8.0).
      # redis 8 still installs, so CI passes — it never talks to a Redis server —
      # but it is an unsupported combination (#3382, closed for this reason).
      # Revisit once `limits` lifts the cap, then remove this ignore rule.
      - dependency-name: "redis"
        update-types:
          - "version-update:semver-major"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
      actions:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
