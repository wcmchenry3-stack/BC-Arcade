name: Nightly dev checks

# One place that runs the heavy checks against one pinned `dev` SHA (#4054, epic #4053), so a
# result and "last green" mean an exact commit.
#
# - Pinned SHA: the default branch is `dev`, so `github.sha` is dev HEAD when the run starts.
#   Every job checks out that SHA (never `ref: dev`), and the local reusable workflows below run
#   at that commit with the same `github.sha`, so a merge to `dev` during the run changes nothing
#   that is tested.
# - `gate` skips the heavy jobs when dev HEAD equals the SHA of tag `nightly/last-green`, unless
#   it is a Monday (UTC) or the dispatch sets `force` (tools/nightly/gate.py). A skipped night is
#   reported as "skipped, dev unchanged", not green. A red night never moves the tag, so an
#   unchanged dev after a red night runs again the next night (it re-tests flakes).
# - Heavy jobs: Playwright (every project), Maestro Android and iOS (full suite, each failed flow
#   retried once), the Cascade (100 seeds, 60 and 120 Hz), Hearts and Yacht sims, the org iOS and
#   Android build checks, the Android release smoke (always built here) and perf (the deployed
#   dev backend, warm-up first). Called workflows get `nightly: true`, which gives them their own
#   concurrency group (a manual dispatch of, say, cascade-sim-gate.yml on dev can't cancel the
#   nightly's job) and 7-day artifacts.
# - Job ids here deliberately differ from the required checks in
#   .github/rulesets/protect-main-dev.json (`Playwright E2E`, `android-release-smoke`): check
#   runs from this workflow land on the dev SHA, which is also the release PR's head.
# - Trigger (#4056): GitHub starts this repo's crons 8-10 h late, so the real trigger is the Render
#   cron `bc-arcade-nightly-trigger` (08:00 UTC, docs/RENDER.md), which dispatches this workflow
#   on `dev`. The `schedule` below is a late fallback: on a `schedule` event the gate first lists
#   the runs of this workflow dispatched in the last 20 h (runs API, not the last-green tag: a red
#   night does not move the tag). One exists: the run is a no-op ("already ran today"). None
#   exists: the external trigger was missed, the nightly runs late and the report subject says so.
# - `tag-last-green` moves `nightly/last-green` to the SHA only when every heavy job succeeded.
# - `summary` writes the SHA, the commit range since the last green night and every job's result
#   and duration to the run summary (tools/nightly/report.py), then (#4055) sends ONE plain-text
#   email through Resend (tools/nightly/send_email.py; repo, run and commit metadata only) and
#   pings the optional heartbeat URL. Secrets are read by name in `env:` of the steps that need
#   them. A deduped fallback run sends nothing. A send failure fails the job, after the summary.
#
# Cost: the repo is public, so GitHub-hosted runners (Linux and macOS) are not billed; the sims,
# Maestro and builds cost runner slots only (about 20 concurrent jobs, 5 macOS). Data: perf's
# game-flow scenario (YachtGameUser, 1 user, 90 s, paced to one game per ~4.3 s) writes about 21
# Yacht games to the dev database per run: ~21 `games` rows and ~550 event rows (13 batches of a
# roll and a score each), about 170 KB at ~300 B an event row. Event rows are replay events,
# pruned after REPLAY_RETENTION_DAYS (30); game rows stay. Until story 6 (#4059) removes
# perf.yml's own `0 6 * * *` schedule, perf runs twice a day (about 340 KB/day, ~10 MB of event
# rows at steady state), and the sim and Maestro schedules also still run on their own.

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Run the heavy jobs even when dev is unchanged since the last green night"
        type: boolean
        required: false
        default: false
  # Late fallback only (see above); the Render cron dispatches the real run at 08:00 UTC.
  schedule:
    - cron: "37 8 * * *"

concurrency:
  group: nightly-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # The runs API, for the dedupe of the fallback schedule.
      actions: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
      reason: ${{ steps.decide.outputs.reason }}
      last_green: ${{ steps.decide.outputs.last_green }}
      trigger_missed: ${{ steps.decide.outputs.trigger_missed }}
      duplicate: ${{ steps.decide.outputs.duplicate }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          sparse-checkout: tools/nightly
          persist-credentials: false

      - name: Decide whether to run
        id: decide
        shell: bash # explicit shell = pipefail, so tee can't mask a gate.py error
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
          FORCE: ${{ inputs.force }}
          EVENT: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # A missing tag (404) means the first tracked night: the gate then runs everything.
          LAST=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/nightly/last-green" \
            --jq 'select(.object.type == "commit") | .object.sha' 2>/dev/null || true)
          # gh can print an error body on a 404; anything but a SHA counts as no tag (so: run).
          if [[ ! "$LAST" =~ ^[0-9a-f]{40}$ ]]; then
            [ -n "$LAST" ] && echo "::warning::Could not read nightly/last-green; running the heavy jobs"
            LAST=""
          fi
          # The fallback schedule asks the runs API whether this workflow already ran in the last
          # 20 h (gate.py excludes this run and applies the window). If the call fails, runs.json
          # is missing and the gate runs without flagging anything.
          RUNS_ARGS=()
          if [ "$EVENT" = "schedule" ]; then
            SINCE=$(date -u -d '20 hours ago' +%Y-%m-%dT%H:%M:%SZ)
            if gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/nightly.yml/runs" \
              -f event=workflow_dispatch -f branch="$DEFAULT_BRANCH" -f "created=>=${SINCE}" \
              -F per_page=100 \
              --jq '[.workflow_runs[] | {id, created_at, event, head_branch}]' > runs.json; then
              # Only dispatches on the default branch count: a feature-branch dispatch tests
              # another SHA and is no substitute for the dev nightly.
              RUNS_ARGS=(--runs runs.json --run-id "$RUN_ID" --branch "$DEFAULT_BRANCH")
            else
              echo "::warning::Could not list recent nightly runs; running without the dedupe"
            fi
          fi
          python3 tools/nightly/gate.py --head "$HEAD_SHA" --last-green "$LAST" \
            --force "${FORCE:-false}" --event "$EVENT" "${RUNS_ARGS[@]}" | tee -a "$GITHUB_OUTPUT"

      - name: Say what the gate decided
        env:
          RUN: ${{ steps.decide.outputs.run }}
          REASON: ${{ steps.decide.outputs.reason }}
        run: |
          echo "### Nightly gate: run=$RUN ($REASON)" >> "$GITHUB_STEP_SUMMARY"

  # ---- Heavy jobs ---------------------------------------------------------------------------

  # Steps copied from ci.yml's `e2e` job (the required `Playwright E2E` check, which stays
  # there), with every project. The project list is e2e/full-suite-projects.txt, shared with
  # ci.yml's detect-e2e-scope.
  playwright-full:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04 # #3514: Playwright 1.58 does not support ubuntu26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: ./.github/actions/setup-frontend

      - name: Build Expo web
        run: npx expo export --platform web
        working-directory: frontend
        env:
          EXPO_PUBLIC_API_URL: http://localhost:8000
          EXPO_PUBLIC_TEST_HOOKS: "1"
          EXPO_PUBLIC_SENTRY_DSN: ""

      - name: Install E2E deps
        run: npm ci
        working-directory: e2e

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Run Playwright tests (full suite)
        run: |
          read -r -a PROJECTS <<< "$(grep -v '^#' full-suite-projects.txt | xargs)"
          ARGS=()
          for p in "${PROJECTS[@]}"; do ARGS+=(--project "$p"); done
          npx playwright test "${ARGS[@]}"
        working-directory: e2e
        env:
          CI: "true"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

  maestro-android:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    uses: ./.github/workflows/mobile-smoke-android.yml
    # A called workflow gets at most what its caller job grants: paths-filter in
    # detect-maestro-scope.yml asks for pull-requests: read, and the comment-media job (skipped
    # for the nightly) declares pull-requests: write.
    permissions:
      contents: read
      pull-requests: write
    with:
      flows: full
      nightly: true

  maestro-ios:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    uses: ./.github/workflows/mobile-smoke-ios.yml
    permissions:
      contents: read
      pull-requests: write
    with:
      flows: full
      nightly: true

  cascade-sim:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    uses: ./.github/workflows/cascade-sim-gate.yml
    with:
      nightly: true

  hearts-sim:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    uses: ./.github/workflows/hearts-sim-gate.yml
    with:
      nightly: true

  yacht-sim:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    uses: ./.github/workflows/yacht-sim-gate.yml
    with:
      nightly: true

  # The org reusables, with the same inputs and `secrets: inherit` as ci.yml's ios-build-check /
  # android-build-check (kept identical; narrowing it is a change for both, see the security
  # review on #4064). The local workflows above read no secret, so they are passed none.
  ios-build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    uses: wcmchenry3-stack/.github/.github/workflows/called-ios-build-check.yml@main
    with:
      working-directory: frontend
      workspace-name: "GamingApp.xcworkspace"
      scheme: "GamingApp"
    secrets: inherit

  android-build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    uses: wcmchenry3-stack/.github/.github/workflows/called-android-build-check.yml@main
    with:
      working-directory: frontend
    secrets: inherit

  # ci.yml's android-release-smoke builds only when a PR changes Android-relevant files; the
  # nightly always builds. Same steps (.github/actions/android-release-smoke).
  android-release-smoke-forced:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    # Same limit as ci.yml's job: headroom for a cold Gradle cache.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/android-release-smoke

  perf:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    uses: ./.github/workflows/perf.yml
    with:
      nightly: true

  # ---- Bookkeeping --------------------------------------------------------------------------

  # Moves nightly/last-green to the tested SHA only when every heavy job succeeded. `!cancelled()`
  # replaces the implicit success(), so every result is checked explicitly: a failed, cancelled
  # or skipped heavy job leaves the tag where it was. A dispatch on any branch but the default
  # (`dev`) never moves it.
  tag-last-green:
    needs:
      - gate
      - playwright-full
      - maestro-android
      - maestro-ios
      - cascade-sim
      - hearts-sim
      - yacht-sim
      - ios-build
      - android-build
      - android-release-smoke-forced
      - perf
    if: >-
      !cancelled() && needs.gate.outputs.run == 'true' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      !contains(needs.*.result, 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # Only the commit object is needed (depth 1); the checkout's token pushes the tag.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          sparse-checkout: tools/nightly

      - name: Move nightly/last-green
        env:
          SHA: ${{ github.sha }}
        run: |
          git tag -f nightly/last-green "$SHA"
          git push -f origin refs/tags/nightly/last-green
          echo "### nightly/last-green moved to \`$SHA\`" >> "$GITHUB_STEP_SUMMARY"

  summary:
    needs:
      - gate
      - playwright-full
      - maestro-android
      - maestro-ios
      - cascade-sim
      - hearts-sim
      - yacht-sim
      - ios-build
      - android-build
      - android-release-smoke-forced
      - perf
      - tag-last-green
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # The jobs API, for durations.
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          sparse-checkout: tools/nightly
          persist-credentials: false

      - name: Write the run summary
        # Everything reaches the script through env and files, never `${{ }}` in the run body.
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          SHA: ${{ github.sha }}
          LAST_GREEN: ${{ needs.gate.outputs.last_green }}
          GATE_REASON: ${{ needs.gate.outputs.reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf '%s' "$NEEDS_JSON" > needs.json
          # Durations: a called workflow's jobs are named "<job id> / <inner name>".
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs" \
            --paginate --jq '.jobs[] | {name, started_at, completed_at} | tojson' > jobs.jsonl || true
          if [ -n "$LAST_GREEN" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/compare/${LAST_GREEN}...${SHA}" \
              --jq '{total_commits, commits: [.commits[] | {sha, message: .commit.message}]}' \
              > compare.json || true
          fi
          python3 tools/nightly/report.py --needs needs.json --sha "$SHA" --jobs jobs.jsonl \
            --compare compare.json --last-green "$LAST_GREEN" --gate-reason "$GATE_REASON" \
            --run-url "$RUN_URL" > nightly-report.md
          cat nightly-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-report
          path: |
            nightly-report.md
            needs.json
          if-no-files-found: ignore
          retention-days: 7

      # Not for a deduped fallback run: it did nothing, and the run it deferred to reports.
      - name: Heartbeat
        if: ${{ !cancelled() && needs.gate.outputs.duplicate != 'true' }}
        env:
          NIGHTLY_HEARTBEAT_URL: ${{ secrets.NIGHTLY_HEARTBEAT_URL }}
        run: |
          # Optional: a monitor that alerts when the ping stops. Unset: skip silently.
          if [ -n "$NIGHTLY_HEARTBEAT_URL" ]; then
            curl -fsS --max-time 20 "$NIGHTLY_HEARTBEAT_URL" > /dev/null 2>&1 \
              || echo "::warning::Heartbeat ping failed"
          fi

      # Last: the summary and the artifact are already written when a send failure fails the job.
      - name: Build and send the report email
        if: ${{ !cancelled() && needs.gate.outputs.duplicate != 'true' }}
        shell: bash
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          SHA: ${{ github.sha }}
          LAST_GREEN: ${{ needs.gate.outputs.last_green }}
          GATE_REASON: ${{ needs.gate.outputs.reason }}
          TRIGGER_MISSED: ${{ needs.gate.outputs.trigger_missed }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NIGHTLY_REPORT_TO: ${{ vars.NIGHTLY_REPORT_TO }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          printf '%s' "$NEEDS_JSON" > needs.json
          python3 tools/nightly/report.py --needs needs.json --sha "$SHA" --jobs jobs.jsonl \
            --compare compare.json --last-green "$LAST_GREEN" --gate-reason "$GATE_REASON" \
            --run-url "$RUN_URL" --trigger-missed "${TRIGGER_MISSED:-false}" \
            --to "$NIGHTLY_REPORT_TO" --email-out email.json > /dev/null
          python3 tools/nightly/send_email.py --payload email.json
