name: Dependency Scan

# Filesystem/dependency vulnerability scan (Trivy). Fails on HIGH or CRITICAL
# findings that have a fix available. Known upstream-blocked advisories may be
# ignored only via the checked-in .trivyignore (reason + tracking link each).

on:
  schedule:
    - cron: "17 6 * * 1" # weekly, Mondays 06:17 UTC
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, dev]
    paths:
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "backend/requirements*.txt"
      - "tools/**/requirements*.txt"
      - ".trivyignore"
      - ".github/workflows/security.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy-fs:
    name: Trivy filesystem scan
    # Skip while the PR is a draft; ready_for_review starts the run (ship-story skill).
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Pinned to a full commit SHA (v0.33.1).
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
          format: table
