name: Dependency Scan

# Filesystem/dependency vulnerability scan (Trivy). Fails on HIGH or CRITICAL
# findings that have a fix available. Known upstream-blocked advisories may be
# ignored only via the checked-in .trivyignore (reason + tracking link each).

on:
  schedule:
    - cron: "17 6 * * 1" # weekly, Mondays 06:17 UTC
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    branches: [main, dev]
    paths:
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "e2e/package.json"
      - "e2e/package-lock.json"
      - "backend/requirements*.txt"
      - "tools/**/requirements*.txt"
      - ".trivyignore"
      - ".github/workflows/security.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy-fs:
    name: Trivy filesystem scan
    # Skip while the PR is a draft; ready_for_review starts the run (ship-story skill).
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Pinned to a full commit SHA of a release outside GHSA-69fq-xp46-6x23's
      # affected range, with an explicit Trivy binary version.
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
          format: table
