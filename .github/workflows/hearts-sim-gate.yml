name: Hearts AI Sim Gate

# Sim gate v2 (#2238): sequential (SPRT) non-regression and persona-
# separation checks on duplicate-deal replay, defined in
# frontend/tooling/hearts/gate.ts against the checked-in baseline
# frontend/tooling/hearts/baseline.json. The fast per-PR smoke layer is
# frontend/tooling/hearts/__tests__/ai.calibrate.test.ts (run by ci.yml).
# Runtime budget and how to read a failure: docs/TESTING.md.

on:
  schedule:
    - cron: "45 7 * * *"
  workflow_dispatch:
    inputs:
      max_blocks:
        description: "Block cap per group (blank = the gate's defaults)"
        required: false
        default: ""
  # PRs that change the AI, the engine, or the gate itself.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "frontend/src/game/hearts/ai*.ts"
      - "frontend/src/game/hearts/engine.ts"
      - "frontend/src/game/hearts/types.ts"
      - "frontend/tooling/hearts/**"
      - "frontend/src/game/_shared/simRandom.ts"
      - "tools/sim/simulate-hearts.ts"
      - ".github/workflows/hearts-sim-gate.yml"

concurrency:
  group: hearts-sim-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    # Skip while the PR is a draft; ready_for_review starts the run (ship-story skill).
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Gate (${{ matrix.group }})
    runs-on: ubuntu-latest
    # Worst case (every check runs to its block cap) is ~12 min per group.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with GATE_GROUPS in frontend/tooling/hearts/gate.ts
        # (gate.test.ts fails if they differ).
        group: [presets, field]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-frontend
      - name: Run gate group
        shell: bash # explicit shell = pipefail, so tee can't mask a failing gate
        env:
          MAX_BLOCKS: ${{ inputs.max_blocks }}
        run: |
          ARGS=(--gate --group "${{ matrix.group }}" --json "hearts-gate-${{ matrix.group }}.json")
          if [ -n "$MAX_BLOCKS" ]; then ARGS+=(--max-blocks "$MAX_BLOCKS"); fi
          # tsx is a frontend devDependency (pinned in frontend/package.json).
          npx --prefix frontend tsx tools/sim/simulate-hearts.ts "${ARGS[@]}" | tee "hearts-gate-${{ matrix.group }}.txt"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hearts-gate-${{ matrix.group }}
          path: hearts-gate-${{ matrix.group }}.*
          retention-days: 30
