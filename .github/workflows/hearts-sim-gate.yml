name: Hearts AI Sim Gate

# Principle check (#3161): plays seeded hands with the conservative CPU in all
# four seats and checks every pass and card play against
# docs/hearts/CONSERVATIVE_AI.md §2.4 with the independent checker in
# frontend/tooling/hearts/principles.ts. The gate is zero violations: 2,000
# hands on PRs, 10,000 nightly and on manual runs.
#
# Whole-game report (#3162): conservative over full games to 100 against
# random-legal, a conservative mirror, the legacy personas and a moon-shooter
# bot, on duplicate deals. Nightly and on manual runs it plays the default
# 2,000 games per matchup (about 2 min); PRs run a 60-game smoke. It is a
# report, except its sanity floor (conservative beats random-legal by the
# margin in gameReport.ts; no principle violation against the moon-shooter),
# which fails the job.
#
# The legacy gate v2 (#2238: SPRT non-regression and persona-separation checks
# in frontend/tooling/hearts/gate.ts against baseline.json) no longer gates
# PRs. It stays runnable on demand: Actions -> Hearts AI Sim Gate -> Run
# workflow with "legacy_gate" ticked. How to read a failure: docs/TESTING.md.

on:
  schedule:
    - cron: "45 7 * * *"
  workflow_dispatch:
    inputs:
      hands:
        description: "Hands for the principle check: a positive integer, blank = 10000 (anything else fails with exit 2)"
        required: false
        default: ""
      games:
        description: "Games per matchup for the whole-game report: a positive integer, blank = 2000 (anything else fails with exit 2)"
        required: false
        default: ""
      legacy_gate:
        description: "Also run the legacy persona-separation / SPRT gate (gate.ts)"
        type: boolean
        required: false
        default: false
      max_blocks:
        description: "Legacy gate only: block cap per group (blank = the gate's defaults)"
        required: false
        default: ""
  # PRs that change the AI, the engine, the spec or the gate itself.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - "frontend/src/game/hearts/ai*.ts"
      - "frontend/src/game/hearts/conservative/**"
      - "frontend/src/game/hearts/engine.ts"
      - "frontend/src/game/hearts/types.ts"
      - "frontend/tooling/hearts/**"
      - "frontend/src/game/_shared/simRandom.ts"
      - "docs/hearts/CONSERVATIVE_AI.md"
      - "tools/sim/simulate-hearts.ts"
      - ".github/workflows/hearts-sim-gate.yml"

concurrency:
  group: hearts-sim-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  principles:
    # Skip while the PR is a draft; ready_for_review starts the run (ship-story skill).
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Principle check (conservative)
    runs-on: ubuntu-latest
    # 10,000 hands take about 25 s locally; 2,000 about 6 s.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-frontend
      - name: Check every decision against CONSERVATIVE_AI.md §2.4
        shell: bash # explicit shell = pipefail, so tee can't mask a failing check
        env:
          HANDS_INPUT: ${{ inputs.hands }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -n "$HANDS_INPUT" ]; then HANDS="$HANDS_INPUT"
          elif [ "$EVENT" = "pull_request" ]; then HANDS=2000
          else HANDS=10000; fi
          # tsx is a frontend devDependency (pinned in frontend/package.json).
          npx --prefix frontend tsx tools/sim/simulate-hearts.ts --check-principles \
            --persona conservative --hands "$HANDS" --json hearts-principles.json \
            | tee hearts-principles.txt
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hearts-principles
          path: hearts-principles.*
          retention-days: 30

  game-report:
    # Skip while the PR is a draft; ready_for_review starts the run (ship-story skill).
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Whole-game report (conservative)
    runs-on: ubuntu-latest
    # 2,000 games per matchup take about 2 min locally.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-frontend
      - name: Play full games and apply the sanity floor
        shell: bash # explicit shell = pipefail, so tee can't mask a failing floor
        env:
          GAMES_INPUT: ${{ inputs.games }}
          EVENT: ${{ github.event_name }}
        run: |
          ARGS=()
          if [ -n "$GAMES_INPUT" ]; then ARGS+=(--games "$GAMES_INPUT")
          elif [ "$EVENT" = "pull_request" ]; then ARGS+=(--games 60); fi
          npx --prefix frontend tsx tools/sim/simulate-hearts.ts --game-report \
            "${ARGS[@]}" --json hearts-game-report.json --md hearts-game-report.md \
            | tee hearts-game-report.txt
      - name: Add the report to the job summary
        if: always()
        shell: bash
        run: |
          if [ -f hearts-game-report.md ]; then cat hearts-game-report.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hearts-game-report
          path: hearts-game-report.*
          retention-days: 30

  gate:
    # Legacy gate v2 (#2238), on demand only.
    if: github.event_name == 'workflow_dispatch' && inputs.legacy_gate
    name: Legacy gate (${{ matrix.group }})
    runs-on: ubuntu-latest
    # Worst case (every check runs to its block cap) is ~12 min per group.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with GATE_GROUPS in frontend/tooling/hearts/gate.ts
        # (gate.test.ts fails if they differ).
        group: [presets, field]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-frontend
      - name: Run gate group
        shell: bash # explicit shell = pipefail, so tee can't mask a failing gate
        env:
          MAX_BLOCKS: ${{ inputs.max_blocks }}
        run: |
          ARGS=(--gate --group "${{ matrix.group }}" --json "hearts-gate-${{ matrix.group }}.json")
          if [ -n "$MAX_BLOCKS" ]; then ARGS+=(--max-blocks "$MAX_BLOCKS"); fi
          npx --prefix frontend tsx tools/sim/simulate-hearts.ts "${ARGS[@]}" | tee "hearts-gate-${{ matrix.group }}.txt"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hearts-gate-${{ matrix.group }}
          path: hearts-gate-${{ matrix.group }}.*
          retention-days: 30
