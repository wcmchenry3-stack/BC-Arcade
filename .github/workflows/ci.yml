name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # === Tier 0: Hygiene gates (run immediately, must pass before tier 1) ====

  gate-main-source:
    uses: wcmchenry3-stack/.github/.github/workflows/called-gate-main-source.yml@main
    secrets: inherit

  secret-scan:
    uses: wcmchenry3-stack/.github/.github/workflows/called-secret-scan.yml@main
    secrets: inherit

  lint-python:
    uses: wcmchenry3-stack/.github/.github/workflows/called-lint-python.yml@main
    with:
      working-directory: backend
      # Keep in lockstep with backend/requirements-dev.txt (the reusable workflow's
      # default ruff is older and would disagree with the local pin). black's default
      # (26.5.1) already matches requirements-dev.txt.
      ruff-version: "0.16.8"
    secrets: inherit

  # tools/**/*.py (dev tooling, #2974): the same reusable workflow, pointed at tools/.
  # tools/pyproject.toml extends backend's ruff rules (line length 100).
  lint-python-tools:
    uses: wcmchenry3-stack/.github/.github/workflows/called-lint-python.yml@main
    with:
      working-directory: tools
      ruff-version: "0.16.8"
    secrets: inherit

  # Unit tests for the Python asset tools (not collected by the backend suite).
  test-tools:
    name: Test tools (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/assets/requirements.txt
      - name: Install tools requirements
        run: pip install -r tools/assets/requirements.txt
      - name: pytest
        working-directory: tools
        run: python -m pytest

  lint-frontend:
    uses: wcmchenry3-stack/.github/.github/workflows/called-lint-frontend.yml@main
    with:
      working-directory: frontend
    secrets: inherit

  conflict-markers:
    name: Conflict marker check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check for merge conflict markers
        run: |
          if grep -rn \
              -e "^<<<<<<< " -e "^=======$" -e "^>>>>>>> " \
              --include="*.ts" --include="*.tsx" --include="*.py" \
              --include="*.js" --include="*.jsx" \
              --include="*.json" --include="*.yml" --include="*.yaml" \
              --exclude-dir=node_modules --exclude-dir=.git \
              .; then
            echo "::error::Merge conflict markers found — resolve before merging"
            exit 1
          fi
          echo "No conflict markers found"

  forbidden-terms:
    name: Forbidden brand/trademark terms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan for trademarked or competitor brand references
        run: |
          # Third-party trademarks and competitor brands must not appear in source,
          # docs, or config. To add a term, append it to TERMS below.
          # Use \b word-boundary anchors where a term could appear as a substring
          # of a legitimate word (e.g. "Fruit Merge" vs "fruit merged").
          #
          # Intentional exclusions:
          #   .github/    — this file contains the terms as grep patterns
          #   .claude/    — tool-config files, not product code
          #   BRANDING.md — anti-guidance doc ("never say X")
          #   CLAUDE.md   — project guide that lists prohibited names
          #   alembic/    — DB migration history; old display names are immutable
          TERMS=(
            "Yahtzee"
            "\bFruit Merge\b"
            "Galaga"
            "Neon Arcade"
          )
          PATTERN=$(printf "%s\n" "${TERMS[@]}" | paste -sd "|")
          if grep -rniE "$PATTERN" \
              --include="*.ts" --include="*.tsx" \
              --include="*.py" \
              --include="*.js" --include="*.jsx" \
              --include="*.json" \
              --include="*.yml" --include="*.yaml" \
              --include="*.md" \
              --exclude-dir=node_modules \
              --exclude-dir=.git \
              --exclude-dir=.github \
              --exclude-dir=.claude \
              --exclude-dir=alembic \
              --exclude=BRANDING.md \
              --exclude=CLAUDE.md \
              .; then
            echo "::error::Forbidden brand/trademark references found — remove before merging"
            exit 1
          fi
          echo "No forbidden terms found"

  # === Tier 1: Substantive fast checks (need lint + secret-scan) ===========

  backend-health:
    needs: [lint-python, lint-frontend, secret-scan, conflict-markers, forbidden-terms]
    uses: wcmchenry3-stack/.github/.github/workflows/called-backend-health.yml@main
    with:
      # Direct Render origin intentionally used here instead of dev-games-api.buffingchi.com.
      # Cloudflare Bot Fight Mode blocks GHA runner IPs (Azure cloud ranges) before
      # the WAF skip rule fires — health checks must bypass the proxy.
      # See wcmchenry3-stack/.github#45.
      backend-url: "https://gaming-app-api-dev.onrender.com"
      health-path: "/health"
      probe-path: "/games/me"
      probe-expected-status: "400"
    secrets: inherit

  # TypeScript type-check (#2211). Separate job so a red X points straight at a type error.
  # Scope: production sources only (tsconfig.typecheck.json excludes tests).
  typecheck-frontend:
    needs: [lint-python, lint-frontend, secret-scan, conflict-markers, forbidden-terms]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-frontend
      - name: TypeScript type-check
        run: npm run typecheck

  expo-compat:
    needs: [lint-python, lint-frontend, secret-scan, conflict-markers, forbidden-terms]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-frontend
      - name: Expo Compatibility Check
        run: |
          echo "Checking dependency compatibility with Expo SDK..."
          # Approved version overrides — packages intentionally ahead of Expo's compat matrix:
          #   @sentry/react-native: Expo's matrix predates Sentry 8, but Sentry 8 declares
          #   peerDependencies: { expo: ">=49.0.0" }, so it is compatible.
          #   @react-native-async-storage/async-storage: v3 is API-compatible for
          #   getItem/setItem/removeItem/getAllKeys/clear (all operations this project uses).
          #   The breaking change (removed multiGet/multiSet/multiRemove) does not affect us.
          #   @shopify/react-native-skia: bumped past Expo's pin for 2.10.0's explicit
          #   react-native-worklets/react-native-reanimated peerDependencies (the combo this
          #   project runs); patch releases since are bug fixes with no API breaks.
          #   react / react-dom: patch-level ahead of Expo's exact pin, same 19.2.x line.
          #   react-native-gesture-handler: major version ahead (3.x) of Expo's tested 2.x pin;
          #   3.x declares a wildcard react-native peerDependency and was already adopted on
          #   dev prior to the SDK 57 bump.
          #   react-native-reanimated / react-native-worklets: must move together and land
          #   slightly ahead of Expo's exact pin — reanimated 4.5.3 is the first stable release
          #   whose peerDependencies (react-native-worklets: 0.10.x - 0.11.x) support pairing
          #   with react-native 0.86.2; verified via npm peerDependency metadata.
          #   react-native-screens / react-native-svg: patch-level ahead, no functional change.
          #   react-native-safe-area-context: minor version ahead of Expo's pin; 5.7.0 -> 5.9.0
          #   is RN 0.85 native-code bumps and bugfixes with no breaking API changes (this
          #   project already runs ahead at react-native 0.86.2).
          APPROVED_OVERRIDES="^\s+@sentry/react-native@|^\s+@react-native-async-storage/async-storage@|^\s+@shopify/react-native-skia@|^\s+react@|^\s+react-dom@|^\s+react-native-gesture-handler@|^\s+react-native-reanimated@|^\s+react-native-safe-area-context@|^\s+react-native-screens@|^\s+react-native-svg@|^\s+react-native-worklets@"
          npx expo install --check 2>&1 | tee /tmp/expo-check.log || true
          UNAPPROVED=$(grep -E "^\s+\S+@\S+ - expected version:" /tmp/expo-check.log | grep -Ev "$APPROVED_OVERRIDES" || true)
          # Expo's compat matrix is a moving target: Expo's own first-party packages (expo,
          # expo-dev-client, expo-audio, expo-modules-core, ...) ship patch releases hours to
          # days apart from each other, so being slightly BEHIND the expected version is a
          # release-cadence artifact, not a real incompatibility — it self-heals on the next
          # routine dependency bump. Being unexpectedly AHEAD of Expo's matrix without an
          # approved override above means an undocumented deviation was introduced; that's the
          # case actually worth hard-failing on.
          AHEAD=""
          BEHIND=""
          if [ -n "$UNAPPROVED" ]; then
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              installed=$(echo "$line" | sed -E 's/^.*@([^@ ]+) - expected version:.*$/\1/')
              expected=$(echo "$line" | sed -E 's/^.*expected version: *//')
              installed_v=$(echo "$installed" | sed -E 's/^[^0-9]*//')
              expected_v=$(echo "$expected" | sed -E 's/^[^0-9]*//')
              if [ "$installed_v" = "$expected_v" ]; then
                continue
              fi
              lowest=$(printf '%s\n%s\n' "$installed_v" "$expected_v" | sort -V | head -1)
              if [ "$lowest" = "$installed_v" ]; then
                BEHIND="${BEHIND}${line}"$'\n'
              else
                AHEAD="${AHEAD}${line}"$'\n'
              fi
            done <<< "$UNAPPROVED"
          fi
          if [ -n "$AHEAD" ]; then
            echo ""
            echo "$AHEAD"
            echo "::error::Expo dependency compatibility check failed: package(s) above are ahead of Expo's compat matrix without an approved override. Add them to APPROVED_OVERRIDES with a documented rationale, or run 'npx expo install --fix' locally to resolve."
            exit 1
          fi
          if [ -n "$BEHIND" ]; then
            echo ""
            echo "$BEHIND"
            echo "::warning::Package(s) above are behind Expo's current compat matrix (Expo's release cadence outrunning our pins, not a hard incompatibility). Run 'npx expo install --fix' locally to catch up."
          fi
          if grep -q "Your project may not work correctly" /tmp/expo-check.log; then
            echo "::warning::Approved version override active: $APPROVED_OVERRIDES (see comment above for rationale)."
          else
            echo "All dependencies are compatible with the installed Expo SDK"
          fi

  detect-native-changes:
    name: Detect native package changes
    needs: [lint-python, lint-frontend, secret-scan, conflict-markers, forbidden-terms]
    runs-on: ubuntu-latest
    outputs:
      has_native_ios: ${{ steps.detect.outputs.has_native_ios }}
      has_native_android: ${{ steps.detect.outputs.has_native_android }}
      has_jsi: ${{ steps.detect.outputs.has_jsi }}
      native_packages: ${{ steps.detect.outputs.native_packages }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v4
        id: pkg_filter
        with:
          filters: |
            package_json:
              - 'frontend/package.json'

      - uses: ./.github/actions/setup-frontend
        if: steps.pkg_filter.outputs.package_json == 'true' && github.event_name == 'pull_request'

      - name: Detect native package bumps
        id: detect
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
          PKG_CHANGED: ${{ steps.pkg_filter.outputs.package_json }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ] || [ -z "$BASE_SHA" ] || [ "$PKG_CHANGED" != "true" ]; then
            echo "has_native_ios=false" >> "$GITHUB_OUTPUT"
            echo "has_native_android=false" >> "$GITHUB_OUTPUT"
            echo "has_jsi=false" >> "$GITHUB_OUTPUT"
            echo "native_packages=" >> "$GITHUB_OUTPUT"
            echo "No native package detection needed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Find packages whose pinned version changed between base and HEAD.
          # Detects both bumps and new additions.
          BUMPED=$(node -e "
            const { execSync } = require('child_process');
            const fs = require('fs');
            const base = JSON.parse(execSync('git show ' + process.env.BASE_SHA + ':frontend/package.json').toString());
            const curr = JSON.parse(fs.readFileSync('frontend/package.json', 'utf8'));
            const before = { ...(base.dependencies || {}), ...(base.devDependencies || {}) };
            const after = { ...(curr.dependencies || {}), ...(curr.devDependencies || {}) };
            console.log(Object.keys(after).filter(k => after[k] !== before[k]).join('\n'));
          " 2>/dev/null || echo "")

          IOS_PKGS=""
          ANDROID_PKGS=""
          JSI_PKGS=""

          while IFS= read -r PKG; do
            [ -z "$PKG" ] && continue
            PKG_DIR="frontend/node_modules/$PKG"
            [ ! -d "$PKG_DIR" ] && continue

            # iOS native: presence of a .podspec signals CocoaPods integration
            if find "$PKG_DIR" -maxdepth 2 -name "*.podspec" 2>/dev/null | grep -q .; then
              IOS_PKGS="${IOS_PKGS:+$IOS_PKGS }$PKG"
            fi

            # Android native: android/ dir containing Java/Kotlin/C++ source
            if [ -d "$PKG_DIR/android" ] && \
               find "$PKG_DIR/android" -maxdepth 4 \
                 \( -name "*.java" -o -name "*.kt" -o -name "*.cpp" \) 2>/dev/null | grep -q .; then
              ANDROID_PKGS="${ANDROID_PKGS:+$ANDROID_PKGS }$PKG"
            fi

            # JSI: runtime binding installer patterns (Expo Go can't satisfy these)
            SEARCH_FILES=$(find "$PKG_DIR" -maxdepth 4 \( -name "*.ts" -o -name "*.js" \) 2>/dev/null | head -200)
            if [ -n "$SEARCH_FILES" ]; then
              JSI_HIT=$(echo "$SEARCH_FILES" | \
                xargs grep -lE "installUIRuntimeBindings|__jsi_version" 2>/dev/null | head -1)
              if [ -n "$JSI_HIT" ]; then
                JSI_PKGS="${JSI_PKGS:+$JSI_PKGS }$PKG"
              fi
            fi
          done <<< "$BUMPED"

          if [ -n "$IOS_PKGS" ]; then HAS_IOS=true; else HAS_IOS=false; fi
          if [ -n "$ANDROID_PKGS" ]; then HAS_ANDROID=true; else HAS_ANDROID=false; fi
          if [ -n "$JSI_PKGS" ]; then HAS_JSI=true; else HAS_JSI=false; fi
          ALL_NATIVE=$(printf '%s\n' $IOS_PKGS $ANDROID_PKGS $JSI_PKGS | sort -u | tr '\n' ' ' | sed 's/ $//')

          echo "has_native_ios=$HAS_IOS" >> "$GITHUB_OUTPUT"
          echo "has_native_android=$HAS_ANDROID" >> "$GITHUB_OUTPUT"
          echo "has_jsi=$HAS_JSI" >> "$GITHUB_OUTPUT"
          echo "native_packages=$ALL_NATIVE" >> "$GITHUB_OUTPUT"

          {
            if [ -n "$ALL_NATIVE" ]; then
              echo "### :warning: Native package changes detected"
              echo ""
              [ -n "$IOS_PKGS" ]     && echo "**iOS native:** \`$IOS_PKGS\`"
              [ -n "$ANDROID_PKGS" ] && echo "**Android native:** \`$ANDROID_PKGS\`"
              [ -n "$JSI_PKGS" ]     && echo "**JSI runtime:** \`$JSI_PKGS\` — verify app loads in Expo Go before merging"
              echo ""
              [ "$HAS_IOS" = "true" ]     && echo "> \`ios-build-check\` will run on this PR."
              [ "$HAS_ANDROID" = "true" ] && echo "> \`android-build-check\` will run on this PR."
            else
              echo "No native package version changes detected."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Safe defaults on detect failure
        if: steps.detect.outcome == 'failure'
        run: |
          echo "has_native_ios=false" >> "$GITHUB_OUTPUT"
          echo "has_native_android=false" >> "$GITHUB_OUTPUT"
          echo "has_jsi=false" >> "$GITHUB_OUTPUT"
          echo "native_packages=" >> "$GITHUB_OUTPUT"
          echo "::warning::detect-native-changes failed — native build gates will not auto-trigger on dev PRs. main-branch conditions still apply." >> "$GITHUB_STEP_SUMMARY"

  sentry-check:
    needs: [lint-python, lint-frontend, secret-scan, conflict-markers, forbidden-terms]
    uses: wcmchenry3-stack/.github/.github/workflows/called-sentry-check.yml@main
    with:
      working-directory: backend
    secrets:
      SENTRY_DSN: ${{ secrets.SENTRY_BC_GAMES }}

  local-path-check:
    needs: [lint-python, lint-frontend, secret-scan, conflict-markers, forbidden-terms]
    uses: wcmchenry3-stack/.github/.github/workflows/called-local-path-check.yml@main
    with:
      scan-paths: "frontend/ios/GamingApp.xcodeproj,frontend/android"
      file-patterns: "*.pbxproj,*.xcconfig,*.gradle,*.properties"
    secrets: inherit

  test-python:
    needs: [lint-python, lint-frontend, secret-scan, conflict-markers, forbidden-terms]
    uses: wcmchenry3-stack/.github/.github/workflows/called-test-python.yml@main
    with:
      working-directory: backend
    secrets: inherit

  test-frontend:
    needs: [lint-python, lint-frontend, secret-scan, conflict-markers, forbidden-terms]
    uses: wcmchenry3-stack/.github/.github/workflows/called-test-frontend.yml@main
    with:
      working-directory: frontend
    secrets: inherit

  cve-python:
    needs: [lint-python, lint-frontend, secret-scan, conflict-markers, forbidden-terms]
    uses: wcmchenry3-stack/.github/.github/workflows/called-cve-python.yml@main
    with:
      working-directory: backend
      ignore-vulns: PYSEC-2025-183  # PyJWT ≤2.12.1 — no fix released yet; tracked in GHSA advisory
    secrets: inherit

  cve-frontend:
    needs: [lint-python, lint-frontend, secret-scan, conflict-markers, forbidden-terms]
    uses: wcmchenry3-stack/.github/.github/workflows/called-cve-frontend.yml@main
    with:
      working-directory: frontend
      # audit-level set to critical because two upstream-blocked high-severity advisories
      # cannot be fixed without a breaking Expo downgrade:
      #   GHSA-w3rx-r6r6-pgpr – image-size ICNS DoS (lodged in metro, awaiting an Expo 56 patch)
      #   GHSA-5p2g-fcmc-qvqq – image-size JXL/HEIF DoS (same)
      # Both affect the metro bundler only — not the production app runtime.
      # Revert to audit-level: high once Expo ships a metro update with a patched image-size.
      audit-level: critical
    secrets: inherit

  detect-e2e-scope:
    name: Detect E2E scope
    needs: [lint-python, lint-frontend, secret-scan, conflict-markers, forbidden-terms]
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.scope.outputs.projects }}
      label: ${{ steps.scope.outputs.label }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # One table for every scope job — see .github/paths/game-paths.yml (#2973).
          filters: .github/paths/game-paths.yml

      - id: scope
        run: |
          # Push events or PRs targeting main always run the full suite
          if [[ "${{ github.event_name }}" == "push" ]] || \
             [[ "${{ github.base_ref }}" == "main" ]] || \
             [[ "${{ steps.filter.outputs.shared }}" == "true" ]] || \
             [[ "${{ steps.filter.outputs.playwright_shared }}" == "true" ]]; then
            echo "projects=yacht blackjack twenty48 cascade mahjong freecell starswarm hearts solitaire sudoku sort daily_word cross logs-budget" >> "$GITHUB_OUTPUT"
            echo "label=full suite (push/main/shared change)" >> "$GITHUB_OUTPUT"
          else
            projects="cross"
            [[ "${{ steps.filter.outputs.yacht }}"     == "true" ]] && projects="$projects yacht"
            [[ "${{ steps.filter.outputs.blackjack }}" == "true" ]] && projects="$projects blackjack"
            [[ "${{ steps.filter.outputs.twenty48 }}"  == "true" ]] && projects="$projects twenty48"
            [[ "${{ steps.filter.outputs.cascade }}"   == "true" ]] && projects="$projects cascade"
            [[ "${{ steps.filter.outputs.mahjong }}"   == "true" ]] && projects="$projects mahjong"
            [[ "${{ steps.filter.outputs.freecell }}"  == "true" ]] && projects="$projects freecell"
            [[ "${{ steps.filter.outputs.starswarm }}" == "true" ]] && projects="$projects starswarm"
            [[ "${{ steps.filter.outputs.hearts }}"    == "true" ]] && projects="$projects hearts"
            [[ "${{ steps.filter.outputs.solitaire }}" == "true" ]] && projects="$projects solitaire"
            [[ "${{ steps.filter.outputs.sudoku }}"    == "true" ]] && projects="$projects sudoku"
            [[ "${{ steps.filter.outputs.sort }}"      == "true" ]] && projects="$projects sort"
            [[ "${{ steps.filter.outputs.daily_word }}" == "true" ]] && projects="$projects daily_word"
            [[ "${{ steps.filter.outputs.logstore }}"  == "true" ]] && projects="$projects logs-budget"
            echo "projects=$projects" >> "$GITHUB_OUTPUT"
            echo "label=selective: $projects" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    name: Playwright E2E
    needs: [test-python, test-frontend, detect-e2e-scope]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-frontend

      - name: Build Expo web
        run: npx expo export --platform web
        working-directory: frontend
        env:
          EXPO_PUBLIC_API_URL: http://localhost:8000
          EXPO_PUBLIC_TEST_HOOKS: "1"
          EXPO_PUBLIC_SENTRY_DSN: ""

      - name: Install E2E deps
        run: npm ci
        working-directory: e2e

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Run Playwright tests (${{ needs.detect-e2e-scope.outputs.label }})
        run: |
          PROJECTS="${{ needs.detect-e2e-scope.outputs.projects }}"
          ARGS=""
          for p in $PROJECTS; do ARGS="$ARGS --project $p"; done
          npx playwright test $ARGS
        working-directory: e2e
        env:
          CI: "true"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

  check-i18n:
    name: i18n completeness check
    needs: [lint-python, lint-frontend, secret-scan, conflict-markers, forbidden-terms]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-frontend
      - name: Check all locale strings are translated
        run: node scripts/check-i18n-strings.js
        working-directory: frontend

  check-color-literals:
    name: Colour literals (per-game palettes)
    needs: [lint-python, lint-frontend, secret-scan, conflict-markers, forbidden-terms]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-frontend
      - name: No colour literals outside the theme and the game palettes (#2989)
        run: node scripts/check-color-literals.mjs
        working-directory: frontend
      - name: Colour-literal checker tests
        run: node --test scripts/check-color-literals.test.mjs
        working-directory: frontend

  # Dead relative links and #anchors in docs/** and the root *.md files (#3000).
  # lychee --offline resolves only local links, so a third-party site being down can't
  # fail a PR. Exclusions (~/.claude/... user-level standards) live in lychee.toml.
  docs-links:
    name: Markdown links (lychee, offline)
    needs: [lint-python, lint-frontend, secret-scan, conflict-markers, forbidden-terms]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check relative links and anchors
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml "docs/**/*.md" "docs/**/*.html" "*.md"
          fail: true
          lycheeVersion: v0.24.2

  # --- Refactor quality gates (#2951, epic #2950) ---------------------------
  # Ratchets set at today's numbers so the epic's gains cannot silently regress.
  # Thresholds and the quarterly lowering schedule: docs/TESTING.md.

  backend-file-length:
    name: Backend file length (per-file caps, default 800)
    needs: [lint-python, lint-frontend, secret-scan, conflict-markers, forbidden-terms]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # stdlib-only script: the runner's system python3 is enough
      - name: Check backend .py files are within their line caps
        run: python3 scripts/check_file_length.py
        working-directory: backend

  large-file-guard:
    name: Large tracked file guard (over 5 MiB)
    needs: [lint-python, lint-frontend, secret-scan, conflict-markers, forbidden-terms]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # stdlib-only script; the allow-list (Cascade art -> #3033, BGM -> #1779) lives in the script
      - name: Fail on tracked files over 5 MiB outside the allow-list
        run: python3 scripts/check_large_files.py

  duplication:
    name: Duplication (jscpd)
    needs: [lint-python, lint-frontend, secret-scan, conflict-markers, forbidden-terms]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: jscpd (fails above 2.5% duplicated lines)
        run: >
          npx --yes jscpd@4.3.0
          --threshold 2.5 --min-lines 20 --min-tokens 70
          --ignore "**/__tests__/**,**/node_modules/**,**/.venv/**,**/*.generated.*,**/locales/**,**/tests/**,**/alembic/**"
          --format "typescript,tsx,python"
          frontend/src frontend/tooling backend

  knip:
    name: Unused code (knip)
    needs: [lint-python, lint-frontend, secret-scan, conflict-markers, forbidden-terms]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-frontend
      # warn-only until 2026-11-04, then --strict; see #2951
      - name: knip
        run: npx knip --no-progress
        continue-on-error: true

  # openai-policy is NOT a job here: openai-policy.yml already runs the same
  # reusable workflow on every PR to dev/main (#2973 removed the duplicate).

  feedback-token-lint:
    needs: [lint-python, lint-frontend, secret-scan, conflict-markers, forbidden-terms]
    uses: wcmchenry3-stack/.github/.github/workflows/called-feedback-token-lint.yml@main
    secrets: inherit

  provenance-coverage:
    needs: [lint-python, lint-frontend, secret-scan, conflict-markers, forbidden-terms]
    uses: wcmchenry3-stack/.github/.github/workflows/called-provenance-coverage.yml@main
    secrets: inherit

  # --- Android JS bundle validation (Linux, fast) ---------------------------
  # Catches silent bundling failures BEFORE they reach EAS Build.
  # The Android build check below only compiles in Debug mode (skips bundling),
  # so it cannot detect issues with the JS bundler or entry-point resolution.

  android-bundle-check:
    needs: [lint-python, lint-frontend, secret-scan, conflict-markers, forbidden-terms]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      # metro-cache is shared with android-release-smoke below and mobile-smoke-android.yml.
      - uses: ./.github/actions/setup-frontend
        with:
          metro-cache: "true"
      - name: Create Android JS bundle
        run: |
          mkdir -p dist
          ENTRY_FILE=$(node -e "require('expo/scripts/resolveAppEntry')" . android absolute | tail -n 1)
          npx expo export:embed \
            --platform android \
            --dev false \
            --entry-file "$ENTRY_FILE" \
            --bundle-output dist/index.android.bundle \
            --assets-dest /tmp/assets
      - name: Validate bundle
        run: |
          if [ ! -f dist/index.android.bundle ]; then
            echo "::error::index.android.bundle was not created — the Android app will crash on launch"
            exit 1
          fi
          BUNDLE_SIZE=$(stat --printf="%s" dist/index.android.bundle)
          if [ "$BUNDLE_SIZE" -lt 1000 ]; then
            echo "::error::index.android.bundle is only ${BUNDLE_SIZE} bytes — likely corrupted"
            exit 1
          fi
          BUNDLE_SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $BUNDLE_SIZE / 1048576}")
          # Limit history (update this when you raise it so future readers understand the trend):
          #   4.5 MB — original baseline
          #   6.0 MB — raised for Expo SDK 56 + game additions (#1977)
          #   8.0 MB — raised for @sentry/react-native 7→8 (#1965)
          #            Sentry 8 ships tracing, session replay, and feedback widget code in its
          #            default CJS build. Metro cannot tree-shake CJS modules, so all of it is
          #            bundled even though we only use basic crash reporting. This is a Sentry
          #            packaging limitation — NOT a Sentry/Metro resolver hack on our side.
          #            If the bundle approaches 8 MB before this is resolved, hold further
          #            dependency upgrades and investigate Metro ESM tree-shaking first.
          MAX_BYTES=8388608
          if [ "$BUNDLE_SIZE" -gt "$MAX_BYTES" ]; then
            echo "::error::JS bundle exceeds 8.0 MB hard limit: ${BUNDLE_SIZE_MB} MB (${BUNDLE_SIZE} bytes). See docs/PERFORMANCE.md for how to update the limit."
            exit 1
          fi
          echo "Android JS bundle: ${BUNDLE_SIZE_MB} MB (${BUNDLE_SIZE} bytes) — within 8.0 MB limit"
          echo "BUNDLE_SIZE_BYTES=$BUNDLE_SIZE" >> "$GITHUB_ENV"
          echo "BUNDLE_SIZE_MB=$BUNDLE_SIZE_MB" >> "$GITHUB_ENV"
      - name: Check bundle size (bundlesize)
        run: npx bundlesize
        continue-on-error: true
      - name: Post bundle size comment
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASELINE_BYTES=4718592
          DELTA_BYTES=$(( BUNDLE_SIZE_BYTES - BASELINE_BYTES ))
          if [ "$DELTA_BYTES" -gt 0 ]; then
            DELTA_STR="+$(awk "BEGIN {printf \"%.0f\", $DELTA_BYTES / 1024}") KB"
          else
            DELTA_STR="$(awk "BEGIN {printf \"%.0f\", $DELTA_BYTES / 1024}") KB"
          fi
          COMMENT="### Bundle size report
          | | Size |
          |---|---|
          | JS bundle (Hermes, Android) | ${BUNDLE_SIZE_MB} MB |
          | Delta vs 4.5 MB baseline | ${DELTA_STR} |
          | Hard limit | 8.0 MB |

          _Measured from \`dist/index.android.bundle\`, minified JS (pre-Hermes). See [PERFORMANCE.md](../blob/${GITHUB_HEAD_REF}/docs/PERFORMANCE.md#js-bundle-size-guardrail) for details._"
          gh pr comment "${{ github.event.pull_request.number }}" \
            --body "$COMMENT" \
            --edit-last 2>/dev/null || \
          gh pr comment "${{ github.event.pull_request.number }}" \
            --body "$COMMENT"

  # === Tier 2: Expensive checks (need unit tests) =============================
  # iOS/Android build checks run on PRs to main, pushes to main, AND any PR
  # where detect-native-changes found a native/JSI package bump. Closes #423
  # (skip on feat→dev when no native packages change) and #2141 (catch native
  # regressions from Dependabot on dev PRs without a hardcoded package list).

  ios-build-check:
    if: |
      github.base_ref == 'main' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      needs.detect-native-changes.outputs.has_native_ios == 'true'
    needs: [test-python, test-frontend, detect-native-changes]
    uses: wcmchenry3-stack/.github/.github/workflows/called-ios-build-check.yml@main
    with:
      working-directory: frontend
      workspace-name: "GamingApp.xcworkspace"
      scheme: "GamingApp"
    secrets: inherit

  android-build-check:
    if: |
      github.base_ref == 'main' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      needs.detect-native-changes.outputs.has_native_android == 'true'
    needs: [test-python, test-frontend, detect-native-changes]
    uses: wcmchenry3-stack/.github/.github/workflows/called-android-build-check.yml@main
    with:
      working-directory: frontend
    secrets: inherit

  podfile-lock-check:
    name: Podfile.lock freshness
    if: needs.detect-native-changes.outputs.has_native_ios == 'true'
    needs: [detect-native-changes]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify Podfile.lock was updated alongside native iOS package bump
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          NATIVE_PKGS: ${{ needs.detect-native-changes.outputs.native_packages }}
        run: |
          CHANGED=$(git diff --name-only "$BASE_SHA"...HEAD)
          if echo "$CHANGED" | grep -q "frontend/ios/Podfile.lock"; then
            echo "Podfile.lock updated alongside native iOS package bump — OK"
          else
            echo "::error::Native iOS package(s) bumped ($NATIVE_PKGS) but frontend/ios/Podfile.lock was not updated."
            echo "::error::Run: cd frontend/ios && pod install"
            echo "::error::Then commit the updated Podfile.lock."
            exit 1
          fi

  # Android release smoke test — path-filtered, runs on PRs only.
  # The debug build check cannot catch release-only failures (Sentry upload,
  # release CMake config, ProGuard). Runs assembleRelease for a single ABI.

  android-release-smoke:
    if: github.event_name == 'pull_request'
    needs: [test-python, test-frontend]
    runs-on: ubuntu-latest
    # 30 min gives headroom for a cold Gradle cache (~20 min); once the cache
    # is warm, runs finish well under that. A job killed by this timeout is
    # cancelled before its own post-job step runs, so the cache never saves —
    # too tight a limit here is self-perpetuating.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect Android-relevant changes
        id: changes
        run: |
          CHANGED=$(git diff --name-only "${{ github.event.pull_request.base.sha }}"...HEAD)
          if echo "$CHANGED" | grep -qE 'frontend/android/|frontend/package\.json|frontend/package-lock\.json'; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Android-relevant file changes — skipping release smoke test"
          fi

      - uses: actions/setup-java@v6
        if: steps.changes.outputs.should_run == 'true'
        with:
          distribution: zulu
          java-version: 17
          cache: gradle
          cache-dependency-path: frontend/android/**/*.gradle*

      # metro-cache is shared with android-bundle-check above and mobile-smoke-android.yml.
      - uses: ./.github/actions/setup-frontend
        if: steps.changes.outputs.should_run == 'true'
        with:
          metro-cache: "true"

      - name: Generate debug keystore for smoke test
        if: steps.changes.outputs.should_run == 'true'
        run: |
          keytool -genkey -v \
            -keystore android/app/debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Release build smoke test (arm64-v8a only)
        if: steps.changes.outputs.should_run == 'true'
        run: |
          cd android
          ./gradlew assembleRelease \
            -PreactNativeArchitectures=arm64-v8a \
            -PUPLOAD_STORE_FILE=debug.keystore \
            -PUPLOAD_STORE_PASSWORD=android \
            -PUPLOAD_KEY_ALIAS=androiddebugkey \
            -PUPLOAD_KEY_PASSWORD=android \
            -PALLOW_DEBUG_SIGNED_RELEASE=true \
            --no-daemon
        # No SENTRY_AUTH_TOKEN: sentry.gradle skips source-map upload when the
        # token is absent, so the smoke test validates the build chain only.
        # Signing is pinned to the generated debug.keystore so the production
        # upload keystore is never required in CI. The real UPLOAD_* values live
        # only in the release machine's user-level ~/.gradle/gradle.properties
        # (see docs/ANDROID-CI.md); the explicit -P flags keep this step
        # independent of any gradle.properties defaults.

  # --- Phase 9: Sentry CLI auth validation (Linux, fast) --------------------
  # Catches expired or misconfigured Sentry auth tokens before they break
  # release builds. Runs only when Sentry config or the token may be affected.

  sentry-cli-check:
    if: github.event_name == 'pull_request'
    needs: [lint-python, lint-frontend, secret-scan, conflict-markers, forbidden-terms]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-frontend

      - name: Validate Sentry CLI auth
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "::warning::SENTRY_AUTH_TOKEN secret is not set — release builds will skip source map upload"
            exit 0
          fi
          npx sentry-cli info
          echo "Sentry CLI authenticated successfully"
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: buffing-chi
          SENTRY_PROJECT: react-native

  # --- Phase 10: Gradle wrapper + dependency version gate -------------------
  # Validates the Gradle wrapper JAR checksum to prevent supply-chain attacks.
  # Also flags dependency version changes that warrant a full release build test.

  gradle-wrapper-check:
    if: github.event_name == 'pull_request'
    needs: [lint-python, lint-frontend, secret-scan, conflict-markers, forbidden-terms]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Check Gradle build file consistency
        run: |
          CHANGED_FILES=$(git diff --name-only "${{ github.event.pull_request.base.sha }}"...HEAD)
          if echo "$CHANGED_FILES" | grep -qE 'frontend/android/(app/)?build\.gradle|frontend/android/settings\.gradle'; then
            echo "::notice::Android Gradle build files changed — ensure gradle.properties settings (SDK versions, Hermes, architectures) are still correct."
          fi
          if echo "$CHANGED_FILES" | grep -qE 'frontend/android/gradle\.properties|frontend/android/gradle/wrapper/gradle-wrapper\.properties'; then
            echo "::warning::Gradle or wrapper version changed — verify android-release-smoke passes before merging."
          fi
          if echo "$CHANGED_FILES" | grep -qE 'frontend/package\.json'; then
            echo "::notice::package.json changed — native module versions may have shifted. Check android-release-smoke and android-build-check results."
          fi
          echo "Gradle wrapper validation passed"
