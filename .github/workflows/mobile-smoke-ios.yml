name: Mobile Smoke — iOS

# Maestro smoke leg for iOS on a GitHub-hosted macOS runner. This is a pre-merge
# check only: iOS release builds come from Xcode Cloud (docs/IOS.md), never from
# this workflow, and nothing here touches frontend/ios/ project files.
#
# Triggers:
# - pull_request into dev/main (re-added for #2347), skipped while the PR is a
#   draft (same rule as ci.yml); `ready_for_review` starts the run. detect-maestro-scope
#   decides what runs: the full suite for workflow/e2e/maestro/shared changes or
#   PRs into main, only the touched games (+ home) for other PRs into dev, and
#   nothing at all — job skipped, no simulator — for PRs that touch nothing
#   Maestro-relevant. The repo is public, so macOS runner minutes are not billed.
# - schedule, weekly (Mon 10:41 UTC, on dev, the default branch): full suite. It
#   refreshes the CocoaPods cache that PR runs only read (a cache saved from a
#   PR ref is invisible to other PRs) and gives a weekly signal. It never gates
#   a PR or a Render deploy. Android's weekly run is Mon 09:23 UTC.
# - workflow_dispatch: always the full suite.
# - NOT push to main (2026-09-23): prod auto-deploys `main` with Render's "After
#   CI Checks Pass" trigger, which waits for EVERY check on the commit, so a red
#   smoke check here would block prod deploys (it blocked #2522). PR runs gate
#   the code before it reaches main instead.
#
# Toolchain (#2347): runs on macos-26 with its newest installed Xcode 26.x (the
# image default, 26.6 as of 2026-10). macos-15 does not work: its default Xcode
# 16.4 (Swift 6.1) can't resolve an SPM dependency that needs Swift tools 6.2,
# and its newest, Xcode 26.3 (Swift 6.2.4), rejects expo-modules-core's
# EventEmitter.swift in Swift 6 mode ("sending 'emitter' risks causing data
# races", PR #3542's first run). The org ios-build-check already builds the app
# on macos-26's default Xcode. macos-26 has only iOS 26 simulator runtimes, so
# the iOS leg pins its own Maestro CLI (2.x; see the maestro-install step).
# The simulator is picked at runtime by
# tools/ios_sim/pick_ios_simulator.py rather than a hardcoded `name=iPhone 16`
# destination — that broke when the image stopped offering the device
# ("Unable to find a device matching the provided destination specifier").
# The app is built in Release for the simulator (see the build step): a Debug
# build's embedded dev bundle RedBoxes at launch.
on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "41 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  # dorny/paths-filter in detect-maestro-scope lists the PR's files through the
  # API; a reusable workflow can't get more than its caller grants.
  pull-requests: read

concurrency:
  group: mobile-smoke-ios-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect-maestro-scope:
    # Skip while the PR is a draft; ready_for_review starts the run (ship-story skill).
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    uses: ./.github/workflows/detect-maestro-scope.yml

  maestro-ios:
    name: Maestro iOS smoke
    needs: detect-maestro-scope
    if: needs.detect-maestro-scope.outputs.projects != ''
    runs-on: macos-26
    # Cold CocoaPods + a full Release build is ~30 min, and the full suite is
    # ~13 flow directories on one simulator. 90 min leaves room for both.
    timeout-minutes: 90
    env:
      # Major version of Xcode to select. 26 ships Swift 6.2 (needed by an SPM
      # dependency); 27 hard-errors on pod targets below iOS 15, so don't float
      # to it without checking the Pods project first.
      XCODE_MAJOR: "26"
      # Preferred simulator runtime major: the newest installed iOS 26.x runtime
      # (macos-26 ships only 26.x). If the image ever drops 26.x, the picker
      # warns (::warning::) and uses the newest runtime it has.
      PREFERRED_IOS_MAJOR: "26"
      # First launch of Maestro's XCTest driver on a cold simulator can exceed
      # the default driver startup timeout on CI runners (milliseconds).
      MAESTRO_DRIVER_STARTUP_TIMEOUT: "180000"
      MAESTRO_CLI_NO_ANALYTICS: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode ${{ env.XCODE_MAJOR }}
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode_${XCODE_MAJOR}*.app 2>/dev/null \
            | grep -E "/Xcode_${XCODE_MAJOR}(\.[0-9]+)*\.app$" | sort -V | tail -1)
          if [ -z "$XCODE_APP" ]; then
            echo "::error::No Xcode ${XCODE_MAJOR}.x in /Applications on this runner image:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version
          swift --version

      - uses: ./.github/actions/setup-frontend

      # iOS-only Maestro version (Android stays on the action's 1.39.13
      # default). 1.39.13's prebuilt XCTest driver predates Xcode 26 / iOS 26:
      # Maestro 2.0.4 "Updated iOS test runner to support Xcode 26"; later 2.x
      # releases fix an XCTest launch-alert hang (2.5.0) and taps after
      # scrollUntilVisible landing in the wrong place (2.9.0). The CLI flags
      # used below (top-level --device, --format, --output, --test-suite-name)
      # are unchanged in 2.12.1.
      - uses: ./.github/actions/maestro-install
        with:
          version: "2.12.1"

      - name: Pick and boot an iPhone simulator
        # Boot now so the simulator comes up while the app builds. A failed or
        # duplicate boot here is not fatal: the install step's
        # `bootstatus -b` boots the device itself if it isn't up yet, and fails
        # there if it can't.
        run: |
          xcrun simctl list runtimes available
          SIM_UDID=$(python3 tools/ios_sim/pick_ios_simulator.py --prefer-major "$PREFERRED_IOS_MAJOR")
          echo "SIM_UDID=$SIM_UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIM_UDID" || echo "::notice::early boot did not start; install step will retry"

      # Read-only except on the default branch: a cache saved from a PR ref is
      # visible only to that PR and would just fill the repo's 10 GB cache. The
      # weekly schedule (and manual runs on dev) save it for every PR to read.
      - name: Restore CocoaPods cache
        id: pods-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            frontend/ios/Pods
            ~/.cocoapods
          # Runner image + Xcode major in the key: Pods generated on another
          # image/toolchain (and the old `pods-` keys) must not be restored.
          key: pods-ios-macos26-xcode${{ env.XCODE_MAJOR }}-${{ hashFiles('frontend/ios/Podfile', 'frontend/ios/Podfile.lock', 'frontend/ios/Podfile.properties.json') }}
          restore-keys: pods-ios-macos26-xcode${{ env.XCODE_MAJOR }}-

      - name: Install CocoaPods dependencies
        working-directory: frontend/ios
        # Retried: the CocoaPods CDN and the RN prebuilt-artifact downloads
        # fail transiently now and then.
        run: |
          for attempt in 1 2 3; do
            pod install --repo-update && exit 0
            echo "::warning::pod install attempt $attempt failed"
            sleep 15
          done
          echo "::error::pod install failed after 3 attempts"
          exit 1

      - name: Save CocoaPods cache
        # Default branch only (same rule as the Android leg's cache-read-only):
        # only default-branch entries are shared with every PR.
        if: github.ref_name == github.event.repository.default_branch && steps.pods-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            frontend/ios/Pods
            ~/.cocoapods
          key: ${{ steps.pods-cache.outputs.cache-primary-key }}

      - name: Build app for iOS Simulator (Release)
        # Release, not Debug (#2347): a Debug build only embeds a *dev* bundle
        # (dev=true), and its devtools bootstrap RedBoxes when loaded from an
        # embedded file ("Cannot create devtools websocket connections in
        # embedded environments"). Release embeds a production bundle natively
        # and leaves out expo-dev-client, so the app opens straight to the real
        # home screen (_shared/launch.yaml's "Load embedded bundle" tap is
        # optional and no-ops). Release has no secret-needing build phases
        # (no Sentry upload phase in project.pbxproj; Sentry never initialises
        # in a test-hooks build, see App.tsx); SENTRY_DISABLE_AUTO_UPLOAD is
        # belt and braces. ONLY_ACTIVE_ARCH=YES: Release defaults to NO, which
        # would also build x86_64 for the simulator.
        # The EXPO_PUBLIC_* values below reach the "Bundle React Native code and
        # images" phase through xcodebuild's environment, and win over the
        # tracked frontend/.env.production (@expo/env never overrides a set
        # variable).
        # No -quiet: it hid the real error in earlier runs. The full log goes to
        # xcodebuild.log (uploaded on failure); xcbeautify turns errors into
        # annotations.
        run: |
          set -o pipefail
          FORMAT=(cat)
          command -v xcbeautify >/dev/null && FORMAT=(xcbeautify --quieter --renderer github-actions)
          xcodebuild \
            -workspace frontend/ios/GamingApp.xcworkspace \
            -scheme GamingApp \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "id=$SIM_UDID" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES \
            build 2>&1 | tee xcodebuild.log | "${FORMAT[@]}"
        env:
          EXPO_PUBLIC_API_URL: https://dev-games-api.buffingchi.com
          EXPO_PUBLIC_TEST_HOOKS: "1"
          SENTRY_DISABLE_AUTO_UPLOAD: "true"

      - name: Verify JS bundle was embedded
        # Fails fast, before any simulator time, if the Release build somehow
        # shipped without its JS bundle — every flow would then fail on its
        # first assertion for a reason unrelated to the flow itself.
        run: |
          BUNDLE="DerivedData/Build/Products/Release-iphonesimulator/GamingApp.app/main.jsbundle"
          if [ ! -f "$BUNDLE" ]; then
            echo "::error::$BUNDLE was not embedded by the Release build's \"Bundle React Native code and images\" phase (see xcodebuild.log)."
            exit 1
          fi
          echo "JS bundle embedded: $BUNDLE ($(stat -f%z "$BUNDLE") bytes)"

      - name: Install app on the simulator
        run: |
          xcrun simctl bootstatus "$SIM_UDID" -b
          xcrun simctl install "$SIM_UDID" DerivedData/Build/Products/Release-iphonesimulator/GamingApp.app

      - name: Run Maestro flows on iOS Simulator
        run: |
          # One `maestro test` invocation per flow directory, not one call
          # covering every directory's files at once, so one directory's
          # failure can't abort the rest of the suite (`|| FAIL=1` below;
          # `exit $FAIL` afterward still fails the step if anything did).
          #
          # `--device` goes before the subcommand: in Maestro 1.39.13 it is only a
          # top-level option (App.kt); 2.x accepts it in both places.
          #
          # `--debug-output maestro-debug/<dir> --flatten-debug-output` keeps
          # each directory's maestro.log and per-flow commands.json / step
          # hierarchies / failure screenshots in one known place for the
          # "Maestro failure details" step and the results artifact.
          #
          # `--format junit --output .../report.xml`: without --format the
          # report format is NOOP and --output writes nothing, leaving
          # e2e/maestro/summarize.py (which reads maestro-results/*/report.xml)
          # with no results.
          #
          # NOTE: this per-directory split does NOT fix — and was never the
          # cause of — the "Unrecognized field \"timeout\"" parse error on
          # YamlElementSelector (#2350). That was a real schema mismatch:
          # `timeout` was never a valid field on assertVisible/
          # assertNotVisible/tapOn in any Maestro version, regardless of how
          # many files are passed to one invocation — confirmed against
          # YamlElementSelector.kt at the pinned v1.39.13 tag. The actual
          # fix was rewriting flows to use `extendedWaitUntil` instead.
          FAIL=0
          for d in ${{ needs.detect-maestro-scope.outputs.projects }}; do
            # offline/ requires toggleAirplaneMode (Android-only) — never runs on iOS.
            [ "$d" = "offline" ] && continue
            mkdir -p "maestro-results/$d"
            maestro --device "$SIM_UDID" test \
              --format junit \
              --test-suite-name "$d" \
              --output "maestro-results/$d/report.xml" \
              --debug-output "maestro-debug/$d" \
              --flatten-debug-output \
              "e2e/maestro/flows/$d/" || FAIL=1
          done
          exit $FAIL

      - name: Maestro failure details
        # Artifacts can't always be fetched, so print the failed command, the
        # elements Maestro saw at that moment and the maestro.log tail
        # (bounded) straight into the job log.
        if: failure()
        run: python3 e2e/maestro/diagnose.py maestro-debug

      - name: Simulator state on failure
        # Last screen plus the app's own log for the last 2 minutes (bounded),
        # to catch JS bundle load errors, redboxes or a system alert.
        if: failure() && env.SIM_UDID != ''
        run: |
          mkdir -p maestro-debug
          xcrun simctl io "$SIM_UDID" screenshot maestro-debug/final-simulator.png || true
          xcrun simctl spawn "$SIM_UDID" log show --last 2m --style compact \
            --predicate 'process == "GamingApp"' 2>&1 | tail -80 || true

      - name: Write job summary
        if: always()
        # offline/ never runs on iOS, so leave it out of the expected-projects
        # list (summarize.py would otherwise report it as missing).
        env:
          LABEL: ${{ needs.detect-maestro-scope.outputs.label }}
          PROJECTS: ${{ needs.detect-maestro-scope.outputs.projects }}
        run: |
          PROJECTS_IOS=$(echo "$PROJECTS" | tr ' ' '\n' | grep -vx offline | tr '\n' ' ' | xargs)
          python3 e2e/maestro/summarize.py "iOS" "$LABEL" "$PROJECTS_IOS"

      - name: Upload Maestro results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: maestro-ios-results
          path: |
            maestro-results/
            maestro-debug/
            ~/.maestro/tests/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload failure screenshots and build log
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: maestro-ios-screenshots
          path: |
            screenshots/
            maestro-results/*/screenshots/
            xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
