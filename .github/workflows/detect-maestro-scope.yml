name: Detect Maestro scope

# Reusable workflow: maps changed paths to the set of Maestro flow directories
# (e2e/maestro/flows/<dir>/) that need to run. Mirrors the `detect-e2e-scope`
# job in ci.yml (same full-suite-vs-selective decision), but keyed to Maestro's
# directory-per-game layout instead of Playwright's project list (Maestro also
# has non-game flow directories — home, offline — and `daily_word` maps to the
# hyphenated `daily-word`), so this can't just reuse detect-e2e-scope's output.
# Both jobs read the same path table: .github/paths/game-paths.yml.
#
# Called by mobile-smoke-android.yml and mobile-smoke-ios.yml. Left as its own
# job/file rather than folding into ci.yml so a mistake here can't destabilize
# the Playwright gate.
#
# Full-suite triggers (#3546): `shared_app` (the app-wide half of Playwright's
# `shared`) and `maestro_shared` (Maestro's own workflows/actions, the path
# table, e2e/maestro, the English locale files flows assert on). Maestro does
# NOT read `shared`, whose .github/workflows/** and .github/actions/** would
# run the whole suite for any workflow edit.
#
# iOS gate (#3547): with `platform: ios`, a PR into dev that changes no
# `native_ios` path resolves to an empty `projects` (the iOS job is skipped)
# and a label saying why. PRs into main, schedule and workflow_dispatch are
# unaffected. Android (`platform: android`, the default) is not gated.
#
# Demo mode (#3705, #3801): `flows: cascade-demo` or `flows: mahjong-demo`,
# passed through from the callers' workflow_dispatch input, resolves to
# `projects=cascade` or `projects=mahjong` and `demo=true`. The callers then
# run only the flows tagged `demo` in that directory
# (--include-tags=demo). Every other run leaves them out (--exclude-tags=demo).

on:
  workflow_call:
    inputs:
      platform:
        description: "Calling leg: android (default) or ios. ios also requires a native/iOS change on PRs into dev (#3547)."
        type: string
        required: false
        default: android
      flows:
        description: "Flow set: `full` or empty (the scope rules below), `cascade-demo` (only the Cascade demo flows, #3705) or `mahjong-demo` (only the Mahjong demo flows, #3801). Callers pass their workflow_dispatch input, which is empty on every other event."
        type: string
        required: false
        default: ""
    outputs:
      projects:
        description: Space-separated Maestro flow directory names to run (empty = nothing Maestro-relevant changed).
        value: ${{ jobs.detect.outputs.projects }}
      label:
        description: Human-readable summary for job summaries/logs.
        value: ${{ jobs.detect.outputs.label }}
      demo:
        description: "`true` when only the flows tagged `demo` run (flows: cascade-demo or mahjong-demo), else `false`."
        value: ${{ jobs.detect.outputs.demo }}

# No `permissions:` block on purpose: a called workflow inherits its
# caller's token, and can't ask for more than the caller grants. Each caller
# sets `contents: read` plus, if it runs on pull_request,
# `pull-requests: read` for dorny/paths-filter's changed-files API call. A
# block here that asked for `pull-requests: read` would make GitHub reject any
# caller that doesn't grant it.

jobs:
  detect:
    name: Detect Maestro scope
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.scope.outputs.projects }}
      label: ${{ steps.scope.outputs.label }}
      demo: ${{ steps.scope.outputs.demo || 'false' }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        # workflow_dispatch and schedule have no before/after pair to diff and
        # always run the full suite anyway (see the `scope` step) — skip the
        # filter rather than depend on how it resolves a base for those events.
        if: github.event_name != 'workflow_dispatch' && github.event_name != 'schedule'
        with:
          # One table for every scope job (game keys, `shared_app`, `maestro_shared`, `native_ios`) —
          # see .github/paths/game-paths.yml (#2973). `daily_word` keeps its
          # underscore there (expression-safe) and is mapped to `daily-word` below.
          filters: .github/paths/game-paths.yml

      # Fails loudly if e2e/maestro/flows/ has a directory (other than
      # _shared) that isn't in the full-suite list below, or vice versa —
      # otherwise a newly added game's flows would silently never run on
      # either platform until someone remembers to update both this list
      # and its matching key in .github/paths/game-paths.yml. The validated list
      # is also exported as this step's `full_suite` output and is the
      # ONLY place the full-suite project set is spelled out — the `scope`
      # step below reads it back instead of hardcoding its own copy, so a
      # PR that updates this list (making the guard pass) can't silently
      # leave a second, drifted copy for push/main runs to use.
      - name: Guard against stale full-suite list
        id: guard
        run: |
          actual=$(ls e2e/maestro/flows | grep -v '^_shared$' | sort | tr '\n' ' ' | xargs)
          expected=$(echo "blackjack cascade daily-word freecell hearts home mahjong offline solitaire sort starswarm sudoku twenty48 yacht" | tr ' ' '\n' | sort | tr '\n' ' ' | xargs)
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::e2e/maestro/flows/ directories ($actual) don't match detect-maestro-scope.yml's hardcoded full-suite list ($expected). Update the full-suite list AND add/remove a matching key in .github/paths/game-paths.yml when a game's Maestro flows are added or removed."
            exit 1
          fi
          echo "full_suite=$expected" >> "$GITHUB_OUTPUT"

      # Inputs and filter results go in through env, not ${{ }} inside the
      # script, so this step can be run locally with mocked values.
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PLATFORM: ${{ inputs.platform }}
          FLOWS: ${{ inputs.flows }}
          FULL_SUITE: ${{ steps.guard.outputs.full_suite }}
          F_SHARED_APP: ${{ steps.filter.outputs.shared_app }}
          F_MAESTRO_SHARED: ${{ steps.filter.outputs.maestro_shared }}
          F_NATIVE_IOS: ${{ steps.filter.outputs.native_ios }}
          F_YACHT: ${{ steps.filter.outputs.yacht }}
          F_BLACKJACK: ${{ steps.filter.outputs.blackjack }}
          F_TWENTY48: ${{ steps.filter.outputs.twenty48 }}
          F_CASCADE: ${{ steps.filter.outputs.cascade }}
          F_MAHJONG: ${{ steps.filter.outputs.mahjong }}
          F_FREECELL: ${{ steps.filter.outputs.freecell }}
          F_STARSWARM: ${{ steps.filter.outputs.starswarm }}
          F_HEARTS: ${{ steps.filter.outputs.hearts }}
          F_SOLITAIRE: ${{ steps.filter.outputs.solitaire }}
          F_SUDOKU: ${{ steps.filter.outputs.sudoku }}
          F_DAILY_WORD: ${{ steps.filter.outputs.daily_word }}
          F_SORT: ${{ steps.filter.outputs.sort }}
        run: |
          case "$PLATFORM" in
            android|ios) ;;
            *) echo "::error::detect-maestro-scope.yml: unknown platform '$PLATFORM' (expected android or ios)"; exit 1 ;;
          esac
          # Demo mode (#3705, #3801): only one game's demo flows, whatever changed.
          # Only a workflow_dispatch sets it: the callers' input is empty on
          # every other event.
          case "$FLOWS" in
            ""|full) ;;
            cascade-demo)
              echo "projects=cascade" >> "$GITHUB_OUTPUT"
              echo "label=Cascade demo flows (flows: cascade-demo)" >> "$GITHUB_OUTPUT"
              echo "demo=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            mahjong-demo)
              echo "projects=mahjong" >> "$GITHUB_OUTPUT"
              echo "label=Mahjong demo flows (flows: mahjong-demo)" >> "$GITHUB_OUTPUT"
              echo "demo=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            *) echo "::error::detect-maestro-scope.yml: unknown flows '$FLOWS' (expected full, cascade-demo or mahjong-demo)"; exit 1 ;;
          esac
          # Push events, manual dispatches, the schedule and PRs targeting
          # main always run the full suite on both legs (the release gate).
          if [[ "$EVENT_NAME" == "push" ]] || \
             [[ "$EVENT_NAME" == "workflow_dispatch" ]] || \
             [[ "$EVENT_NAME" == "schedule" ]] || \
             [[ "$BASE_REF" == "main" ]]; then
            echo "projects=$FULL_SUITE" >> "$GITHUB_OUTPUT"
            echo "label=full suite ($EVENT_NAME${BASE_REF:+ into $BASE_REF})" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # iOS leg on a PR into dev (#3547): only for native/iOS changes.
          # JS-only changes are covered by the Android leg; iOS still runs
          # the full suite on the release PR into main and weekly.
          if [[ "$PLATFORM" == "ios" ]] && [[ "$F_NATIVE_IOS" != "true" ]]; then
            label="iOS skipped: no native/iOS change (runs on release PRs, native changes, weekly)"
            echo "projects=" >> "$GITHUB_OUTPUT"
            echo "label=$label" >> "$GITHUB_OUTPUT"
            # The iOS job is skipped, so its own summary step never runs: say
            # why here, in this job's summary.
            echo "### Maestro iOS: $label" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # A shared path (app-wide or Maestro infra) runs the full suite.
          if [[ "$F_SHARED_APP" == "true" ]] || [[ "$F_MAESTRO_SHARED" == "true" ]]; then
            echo "projects=$FULL_SUITE" >> "$GITHUB_OUTPUT"
            echo "label=full suite (shared change)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Build from matched game filters only — NOT seeded with "home",
          # so a PR touching nothing Maestro-relevant (backend-only,
          # docs-only) resolves to a genuinely empty string. That empty
          # string is what lets mobile-smoke-{android,ios}.yml's
          # `if: needs.detect-maestro-scope.outputs.projects != ''` skip
          # the job entirely — no emulator/simulator boot for those PRs.
          # offline is excluded from selective runs (Android-only, already
          # excluded from the iOS job entirely) — full suite only.
          projects=""
          [[ "$F_YACHT"      == "true" ]] && projects="$projects yacht"
          [[ "$F_BLACKJACK"  == "true" ]] && projects="$projects blackjack"
          [[ "$F_TWENTY48"   == "true" ]] && projects="$projects twenty48"
          [[ "$F_CASCADE"    == "true" ]] && projects="$projects cascade"
          [[ "$F_MAHJONG"    == "true" ]] && projects="$projects mahjong"
          [[ "$F_FREECELL"   == "true" ]] && projects="$projects freecell"
          [[ "$F_STARSWARM"  == "true" ]] && projects="$projects starswarm"
          [[ "$F_HEARTS"     == "true" ]] && projects="$projects hearts"
          [[ "$F_SOLITAIRE"  == "true" ]] && projects="$projects solitaire"
          [[ "$F_SUDOKU"     == "true" ]] && projects="$projects sudoku"
          [[ "$F_DAILY_WORD" == "true" ]] && projects="$projects daily-word"
          [[ "$F_SORT"       == "true" ]] && projects="$projects sort"
          if [[ -n "$projects" ]]; then
            # home is cheap and catches nav regressions — include it, but
            # only once at least one real game matched (a docs/backend-only
            # PR must still resolve to nothing).
            projects="home$projects"
            echo "label=selective:$projects" >> "$GITHUB_OUTPUT"
          elif [[ "$PLATFORM" == "ios" ]]; then
            # A native/iOS change that touches no game (a pod or native
            # dependency bump, an Xcode project edit) can break any screen,
            # so the iOS leg runs the full suite rather than nothing.
            echo "projects=$FULL_SUITE" >> "$GITHUB_OUTPUT"
            echo "label=full suite (native/iOS change, no game matched)" >> "$GITHUB_OUTPUT"
            exit 0
          else
            echo "label=nothing Maestro-relevant changed" >> "$GITHUB_OUTPUT"
          fi
          echo "projects=$(xargs <<< "$projects")" >> "$GITHUB_OUTPUT"
