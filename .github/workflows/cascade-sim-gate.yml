name: Cascade Sim Gate

# Long run of the Cascade sim harness (#2893): 100 seeded games per bot (heuristic, random,
# spam) at 60 and 120 Hz against the real engine, spawn selector and queue, compared with
# frontend/src/game/cascade/sim/baseline.json. It fails when a banded metric leaves its band
# (piece frequency and drought, game length, score, top-tier rate, packing density, visible gap,
# settle time, jitter, guard-rail events), when the spam bot does not reach game over inside
# 120 simulated seconds (the lid, #3694), or when the mean step cost with 20+ pieces passes
# 16 ms. About 2.5 min. The same checks in miniature (3 seeds) run in every PR's Jest run
# (frontend/src/game/cascade/sim/__tests__/sim.test.ts). How to read a failure and how to
# re-baseline: docs/TESTING.md ("Cascade sim") and docs/games/cascade.md.

on:
  schedule:
    - cron: "15 8 * * *"
  workflow_dispatch:
    inputs:
      seeds:
        description: "Seeds per bot and frame rate: a positive integer, blank = 100 (anything else fails with exit 2)"
        required: false
        default: ""
  # PRs that change the engine, its constants, the queue or the sim itself.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - "frontend/src/game/cascade/engine.ts"
      - "frontend/src/game/cascade/constants.ts"
      - "frontend/src/game/cascade/pieceDefs.ts"
      - "frontend/src/game/cascade/pieceQueue.ts"
      - "frontend/src/game/cascade/spawnSelector.ts"
      - "frontend/src/game/cascade/sim/**"
      - "frontend/src/game/_shared/seededRng.ts"
      - "tools/sim/simulate-cascade.ts"
      - ".github/workflows/cascade-sim-gate.yml"

concurrency:
  group: cascade-sim-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    # Skip while the PR is a draft; ready_for_review starts the run (ship-story skill).
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Cascade sim (100 seeds, 60 and 120 Hz)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-frontend
      - name: Play the games and check the baseline bands
        shell: bash # explicit shell = pipefail, so tee can't mask a failing gate
        env:
          SEEDS_INPUT: ${{ inputs.seeds }}
        run: |
          ARGS=(--full --gate --md cascade-sim.md --json cascade-sim.json)
          if [ -n "$SEEDS_INPUT" ]; then ARGS+=(--seeds "$SEEDS_INPUT"); fi
          # tsx is a frontend devDependency (pinned in frontend/package.json).
          npx --prefix frontend tsx tools/sim/simulate-cascade.ts "${ARGS[@]}" | tee cascade-sim.txt
      - name: Add the table to the job summary
        if: always()
        shell: bash
        run: |
          if [ -f cascade-sim.md ]; then cat cascade-sim.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cascade-sim
          path: cascade-sim.*
          retention-days: 30
