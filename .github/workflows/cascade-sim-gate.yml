name: Cascade Sim Gate

# Long run of the Cascade sim harness (#2893): 100 seeded games per bot (heuristic, random,
# spam) at 60 and 120 Hz against the real engine (planck.js since #3697), spawn selector and
# queue, plus the capstone runs (#3697: the skilled bot, 60 Hz, up to 10 simulated
# minutes, stopping at the win; 100 seeds nightly and on manual runs, 50 on PRs to keep them
# near 7 min), compared with frontend/src/game/cascade/sim/baseline.json (the capstone bands
# widened by sqrt(100 / 50) for the 50-seed runs, baselineForCapstoneSeeds). It
# fails when a banded metric leaves its band (piece frequency and drought, game length, score,
# top-tier rate, win rate and time to the capstone, packing density, visible gap, overlap,
# settle time, jitter, wall penetration, chain latency), when the spam bot does not reach game
# over inside 120 simulated seconds (the lid, #3694), when a guard rail fires, when chain merges
# are slow (p90 150 ms or more), or when the mean step cost with 20+ pieces passes 16 ms.
# About 12 min at 100 capstone seeds (the capstone runs are about 4 of it), about 7 min on PRs. A manual run with a seed count other than 100 is informational (bands skipped). The same checks in miniature (3 seeds) run in every PR's Jest run
# (frontend/src/game/cascade/sim/__tests__/sim.test.ts). How to read a failure and how to
# re-baseline: docs/TESTING.md ("Cascade sim") and docs/games/cascade.md.

on:
  schedule:
    - cron: "15 8 * * *"
  workflow_dispatch:
    inputs:
      seeds:
        description: "Seeds per bot and frame rate: a positive integer, blank = 100 (anything else fails with exit 2). Other than 100 is informational: the table prints and band checks are skipped"
        required: false
        default: ""
  # PRs that change the engine, its constants, the queue or the sim itself.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      - "frontend/src/game/cascade/engine.ts"
      - "frontend/src/game/cascade/physicsWorld.ts"
      - "frontend/src/game/cascade/constants.ts"
      - "frontend/src/game/cascade/pieceDefs.ts"
      - "frontend/src/game/cascade/tiers.ts"
      - "frontend/src/game/cascade/pieceQueue.ts"
      - "frontend/src/game/cascade/spawnSelector.ts"
      - "frontend/src/game/cascade/sim/**"
      - "frontend/src/game/_shared/seededRng.ts"
      - "tools/sim/simulate-cascade.ts"
      - ".github/workflows/cascade-sim-gate.yml"

concurrency:
  group: cascade-sim-gate-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    # Skip while the PR is a draft; ready_for_review starts the run (ship-story skill).
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Cascade sim (full suite, 60 and 120 Hz)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-frontend
      - name: Play the games and check the baseline bands
        shell: bash # explicit shell = pipefail, so tee can't mask a failing gate
        env:
          SEEDS_INPUT: ${{ inputs.seeds }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          ARGS=(--full --gate --md cascade-sim.md --json cascade-sim.json)
          if [ -n "$SEEDS_INPUT" ]; then ARGS+=(--seeds "$SEEDS_INPUT"); fi
          # PRs play 50 capstone seeds (owner decision); nightly and manual runs keep 100.
          if [ "$EVENT_NAME" = "pull_request" ]; then ARGS+=(--capstone-seeds 50); fi
          # tsx is a frontend devDependency (pinned in frontend/package.json).
          npx --prefix frontend tsx tools/sim/simulate-cascade.ts "${ARGS[@]}" | tee cascade-sim.txt
      - name: Add the table to the job summary
        if: always()
        shell: bash
        run: |
          if [ -f cascade-sim.md ]; then cat cascade-sim.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cascade-sim
          path: cascade-sim.*
          retention-days: 30
